<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PoliTutors — Prototipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#2450c7; --brand-2:#1b3d99; --brand-soft:#e9effc;
  --accent:#f5a524; --accent-soft:#fff4de;
  --ink:#0f172a; --ink-2:#334155; --muted:#64748b; --line:#e4e8f0;
  --bg:#f5f7fb; --card:#fff; --ok:#15803d; --ok-soft:#e7f6ec; --bad:#c2410c; --bad-soft:#fdeee6;
  --r:16px; --sh:0 1px 2px rgba(15,23,42,.05),0 8px 24px rgba(15,23,42,.06);
}
*{box-sizing:border-box}
html,body{margin:0}
html{scroll-behavior:smooth;scroll-padding-top:80px}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body.touring{padding-bottom:150px}
a{color:inherit}
button{font:inherit;cursor:pointer;color:inherit}
button:disabled{cursor:not-allowed}
h1,h2,h3,h4{margin:0;line-height:1.2;letter-spacing:-.01em}
h3{font-size:16px;margin:4px 0 12px}
p{margin:0}
.wrap{max-width:1140px;margin:0 auto;padding:0 20px}
.muted{color:var(--muted)} .tiny{font-size:12.5px} .center{text-align:center}
.row{display:flex;align-items:center} .gap{gap:12px} .wrapf{flex-wrap:wrap} .end{justify-content:flex-end} .between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:16px}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:18px;height:64px}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:19px;text-decoration:none;letter-spacing:-.02em}
.mark{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--brand),#5b84f0);color:#fff;display:grid;place-items:center;font-size:16px;box-shadow:0 4px 10px rgba(36,80,199,.3)}
.logo .t2{color:var(--brand)}
.pubnav{display:flex;gap:2px;margin-left:auto}
.link{background:none;border:0;text-decoration:none;padding:8px 12px;border-radius:999px;font-weight:600;color:var(--ink-2);font-size:14px}
.link:hover{background:var(--bg)}
.role-pill{font-size:12px;font-weight:700;background:var(--brand-soft);color:var(--brand);padding:4px 10px;border-radius:999px}
.user-chip{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px}

/* buttons */
.btn{border:1px solid transparent;border-radius:12px;padding:10px 18px;font-weight:700;font-size:14.5px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:.15s;white-space:nowrap}
.btn.primary{background:var(--brand);color:#fff;box-shadow:0 4px 12px rgba(36,80,199,.25)}
.btn.primary:hover:not(:disabled){background:var(--brand-2)}
.btn.primary:disabled{background:#a9b8e3;box-shadow:none}
.btn.ghost{background:#fff;border-color:var(--line);color:var(--ink)}
.btn.ghost:hover{border-color:#c9d2e3}
.btn.danger{background:#fff;border-color:#f3c7b4;color:var(--bad)}
.btn.ok{background:var(--ok);color:#fff}
.btn.dark{background:var(--ink);color:#fff}
.btn.lg{padding:13px 22px;font-size:15.5px}
.btn.block{width:100%}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--sh)}
.pill{display:inline-block;background:var(--brand-soft);color:var(--brand);font-weight:700;font-size:12.5px;padding:6px 12px;border-radius:999px}
.pill.amber{background:var(--accent-soft);color:#9a5b00}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-size:13.5px;font-weight:600;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.chip:hover{border-color:#b9c6e6}
.chip.on,.chip:has(input:checked){background:var(--brand);border-color:var(--brand);color:#fff}
.chip input{display:none}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
textarea,input[type=text],input[type=email],input[type=tel],input[type=password],input[type=number],input[type=date],select{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 13px;font:inherit;background:#fbfcfe;resize:vertical;color:var(--ink)}
textarea:focus,input:focus,select:focus{outline:2px solid #bccbf3;border-color:var(--brand);background:#fff}
label.lbl{display:block;font-weight:700;font-size:13.5px;margin:0 0 6px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fgrid .full{grid-column:1/-1}
.hint{font-size:12.5px;color:var(--muted);margin-top:5px}
.check{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;font-size:14px;background:#fff;cursor:pointer}
.check input{margin-top:3px;width:17px;height:17px;flex:none;accent-color:var(--brand)}
.check small{display:block;color:var(--muted);font-size:12.5px}
.err{color:var(--bad);background:var(--bad-soft);padding:9px 12px;border-radius:10px;font-size:13.5px;font-weight:600;margin-top:12px}
.note{background:var(--accent-soft);color:#7a4a00;border-radius:12px;padding:10px 14px;font-size:13px}
.info{background:var(--brand-soft);color:#1e3a8a;border-radius:12px;padding:10px 14px;font-size:13.5px}

/* hero */
.hero{padding:52px 0 36px;background:radial-gradient(900px 420px at 85% 0%,#dfe7fb 0%,transparent 60%),radial-gradient(600px 300px at 0% 100%,#fff1d6 0%,transparent 60%)}
.hero-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:44px;align-items:center}
.hero h1{font-size:46px;font-weight:800;letter-spacing:-.03em;margin:16px 0 14px}
.hl{color:var(--brand)}
.lead{font-size:17px;color:var(--ink-2);max-width:560px;margin-bottom:22px}
.trust{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:18px;font-size:13.5px;font-weight:600;color:var(--ink-2)}
.trust span::before{content:"✓";color:var(--ok);margin-right:6px;font-weight:800}
.role-ctas{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.role-cta{display:flex;flex-direction:column;gap:6px;text-decoration:none;background:#fff;border:2px solid var(--line);border-radius:18px;padding:18px;transition:.15s;box-shadow:var(--sh)}
.role-cta:hover{border-color:var(--brand);transform:translateY(-2px)}
.role-cta .q{font-size:13px;font-weight:700;color:var(--muted)}
.role-cta .a{font-size:18px;font-weight:800;letter-spacing:-.01em}
.role-cta .go{color:var(--brand);font-weight:700;font-size:14px;margin-top:4px}
.role-cta.tut .go{color:#0e9384}
.role-cta.tut:hover{border-color:#0e9384}
.phone{background:#fff;border-radius:28px;border:1px solid var(--line);box-shadow:0 30px 60px rgba(15,23,42,.12);padding:18px;max-width:330px;margin-left:auto}
.phone .ok-bar{background:var(--ok-soft);color:var(--ok);font-weight:700;font-size:13px;padding:8px 12px;border-radius:10px;margin-bottom:14px}
.mini-rep{margin-top:14px;border-top:1px dashed var(--line);padding-top:12px;font-size:13px}
.mini-rep ul{margin:6px 0 0;padding-left:18px;color:var(--ink-2)}
.demo-link{background:none;border:0;color:var(--brand);font-weight:700;font-size:14px;padding:0;margin-top:14px;display:inline-flex;gap:8px;align-items:center}
.demo-link span{width:28px;height:28px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:11px}

section.block{padding:52px 0}
section.white{background:#fff;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.sec-head{text-align:center;max-width:660px;margin:0 auto 28px}
.sec-head h2{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:10px 0 8px}
.tabs{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:4px;margin:0 auto 22px}
.tabs button{border:0;background:none;padding:8px 18px;border-radius:999px;font-weight:700;font-size:14px;color:var(--muted)}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:var(--sh)}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.step-n{width:34px;height:34px;border-radius:10px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-weight:800;margin-bottom:12px}
.steps h4{margin-bottom:6px}
.feat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.feat{display:flex;flex-direction:column}
.feat h4{font-size:15px;margin:8px 0 6px}
.feat p{font-size:13.5px;color:var(--muted);flex:1}
.feat .num{font-weight:800;color:var(--accent);font-size:13px}
.feat button{align-self:flex-start;margin-top:12px;background:none;border:0;padding:0;color:var(--brand);font-weight:700;font-size:13px}
.trust-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.trust-ic{width:42px;height:42px;border-radius:12px;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;font-size:20px;margin-bottom:12px}
.price-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.price{text-align:center}
.price b{display:block;font-size:30px;font-weight:800;letter-spacing:-.02em;margin:6px 0}
.price.hot{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft),var(--sh)}
.guarantee{display:flex;gap:16px;align-items:center;margin-top:18px;background:var(--ok-soft);border-radius:16px;padding:16px 20px;color:#14532d}
.guarantee b{font-size:16px}
.devices{display:grid;grid-template-columns:1fr 1fr;gap:32px;align-items:center}
.dev-row{display:flex;gap:14px;align-items:flex-end;justify-content:center}
.dev{background:#0f172a;border-radius:18px;padding:8px}
.dev .scr{background:linear-gradient(160deg,var(--brand-soft),#fff);border-radius:12px;display:grid;place-items:center;color:var(--brand);font-weight:800}
.testi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.testi p{font-size:14.5px;color:var(--ink-2);margin:10px 0 14px}
.faq-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
details{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px}
summary{font-weight:700;cursor:pointer;font-size:14.5px}
details p{margin-top:8px;color:var(--ink-2);font-size:14px}
.final-cta{background:linear-gradient(135deg,var(--brand),#4f78e8);border-radius:24px;padding:36px;color:#fff;text-align:center}
.final-cta h2{font-size:28px;font-weight:800;margin-bottom:18px}
.final-cta .role-ctas{max-width:640px;margin:0 auto;text-align:left}
.final-cta .role-cta{color:var(--ink)}
footer{border-top:1px solid var(--line);padding:24px 0 40px;color:var(--muted);font-size:13px;margin-top:20px}
footer .link{font-size:13px;padding:4px 8px}

/* pages */
.page{padding:28px 20px 60px}
.page.narrow{max-width:760px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.page-head h2{font-size:26px;font-weight:800;letter-spacing:-.02em}
.grid-2-1{display:grid;grid-template-columns:1.6fr 1fr;gap:20px;align-items:start}
.center-page{display:grid;place-items:center;min-height:calc(100vh - 160px)}

/* wizard */
.wiz-steps{display:flex;gap:6px;margin:0 0 20px;flex-wrap:wrap}
.ws{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--muted);padding:6px 12px 6px 6px;border-radius:999px;background:#fff;border:1px solid var(--line)}
.ws span{width:24px;height:24px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:12px}
.ws.on{color:var(--brand);border-color:var(--brand)}
.ws.on span{background:var(--brand);color:#fff}
.ws.done{color:var(--ok)}
.ws.done span{background:var(--ok-soft);color:var(--ok)}
.who-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.who{background:#fff;border:2px solid var(--line);border-radius:18px;padding:22px;text-align:left;display:flex;flex-direction:column;gap:6px}
.who:hover{border-color:var(--brand)}
.who .ic{font-size:28px}
.who b{font-size:18px}
.wiz-foot{display:flex;justify-content:space-between;gap:12px;margin-top:20px}
.cred{background:var(--bg);border-radius:14px;padding:14px 16px;font-size:14px;margin:14px 0}
.cred code{background:#fff;border:1px solid var(--line);padding:2px 8px;border-radius:6px;font-weight:700}
.big-ok{width:64px;height:64px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;font-size:30px;margin:0 auto 14px;font-weight:800}
.big-wait{width:64px;height:64px;border-radius:50%;background:var(--accent-soft);color:#9a5b00;display:grid;place-items:center;font-size:28px;margin:0 auto 14px}
.file-row{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px dashed #c6d0e3;border-radius:12px;padding:12px 14px;margin-bottom:10px;background:#fbfcfe}
.file-row input{font-size:13px;max-width:230px}
.subj-row{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:10px}
.subj-row label{flex:1;display:flex;align-items:center;gap:10px;font-weight:700}
.subj-row input[type=checkbox]{width:17px;height:17px;accent-color:var(--brand)}
.subj-row input[type=number]{width:110px}
.quiz{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.quiz .opts{display:grid;gap:8px;margin-top:10px}
.quiz label{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:14px;cursor:pointer}
.quiz label:has(input:checked){border-color:var(--brand);background:var(--brand-soft)}
.coc{background:var(--bg);border-radius:12px;padding:12px 14px;font-size:13.5px;color:var(--ink-2);margin:0 0 12px}
.coc ul{margin:6px 0 0;padding-left:18px}
.timeline{list-style:none;padding:0;margin:16px 0}
.timeline li{display:flex;gap:12px;padding:10px 0;align-items:flex-start}
.timeline .d{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;flex:none}
.timeline .d.ok{background:var(--ok-soft);color:var(--ok)}
.timeline .d.wait{background:var(--accent-soft);color:#9a5b00}
.timeline .d.no{background:var(--bg);color:var(--muted)}

/* student */
.online-pill{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-weight:600;font-size:13.5px}
.dot{width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 4px rgba(34,197,94,.18)}
.subj-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
.subj{border:2px solid var(--line);background:#fff;border-radius:14px;padding:14px;font-weight:700;display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:left}
.subj-ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 12%,white);color:var(--c);font-size:19px}
.subj.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 5%,white)}
.dur-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.dur{border:2px solid var(--line);background:#fff;border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px}
.dur b{font-size:17px}
.dur span{font-size:12.5px;color:var(--muted);font-weight:600}
.dur.on{border-color:var(--brand);background:var(--brand-soft)}
.dur:disabled{opacity:.45}
.photo-drop{display:flex;align-items:center;gap:12px;border:1px dashed #c6d0e3;border-radius:12px;padding:12px;margin-top:10px;background:#fbfcfe;font-size:13.5px}
.photo-drop img{width:64px;height:64px;object-fit:cover;border-radius:8px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv span{color:var(--muted)}
.kv b{text-align:right}
.kv.total{border:0;font-size:17px;margin:4px 0 14px}
.locked{position:relative}
.locked::after{content:"";position:absolute;inset:0;background:rgba(245,247,251,.6);border-radius:var(--r)}
.av{width:40px;height:40px;border-radius:50%;color:#fff;display:grid;place-items:center;font-weight:800;font-size:14px;flex:none}
.av.lg{width:68px;height:68px;font-size:22px}
.av.sm{width:32px;height:32px;font-size:12px}
.verified{display:inline-flex;align-items:center;gap:4px;background:var(--ok-soft);color:var(--ok);font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;vertical-align:middle;margin-left:6px;white-space:nowrap}
.vbadges{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.vbadge{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--brand-soft);color:var(--brand)}
.stars{color:var(--accent);letter-spacing:1px}
.stars .off{color:#d7dce6}
.rating{display:flex;align-items:center;gap:6px;font-size:14px;margin-top:4px}
.rep-row{margin:10px 0}
.rep-row .row{justify-content:space-between;font-size:13.5px;font-weight:600}
.bar{height:8px;background:#eef1f6;border-radius:99px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),#6d92f2);border-radius:99px}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:6px}
.medal{text-align:center;border-radius:14px;padding:12px 6px;background:var(--bg)}
.medal .m{width:46px;height:46px;border-radius:50%;margin:0 auto 6px;display:grid;place-items:center;font-size:20px;font-weight:800}
.medal.oro .m{background:#fff1c2;color:#a16207;box-shadow:0 0 0 3px #fde68a}
.medal.plata .m{background:#eef1f6;color:#475569;box-shadow:0 0 0 3px #e2e8f0}
.medal.bronce .m{background:#fbe9dd;color:#9a3412;box-shadow:0 0 0 3px #fed7aa}
.medal.none .m{background:#fff;color:#cbd5e1;box-shadow:0 0 0 2px dashed #e2e8f0}
.medal b{display:block;font-size:13px}
.medal span{font-size:11.5px;color:var(--muted)}

.match-card{text-align:center;max-width:460px;width:100%;padding:36px 28px}
.radar{position:relative;width:160px;height:160px;margin:0 auto}
.radar span{position:absolute;inset:0;border-radius:50%;border:2px solid var(--brand);opacity:0;animation:ping 2.4s infinite}
.radar span:nth-child(2){animation-delay:.8s}.radar span:nth-child(3){animation-delay:1.6s}
.radar-core{position:absolute;inset:50px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:26px;box-shadow:0 8px 20px rgba(36,80,199,.35)}
@keyframes ping{0%{transform:scale(.35);opacity:.9}100%{transform:scale(1);opacity:0}}
.big-timer{font-size:44px;font-weight:800;letter-spacing:-.02em;margin:12px 0 2px;font-variant-numeric:tabular-nums}
.notified{display:flex;justify-content:center;margin:12px 0}
.notified .av{width:34px;height:34px;font-size:12px;margin-left:-8px;border:2px solid #fff;opacity:.35;transition:.3s}
.notified .av.lit{opacity:1}
.success-banner{background:var(--ok-soft);color:var(--ok);border-radius:12px;padding:12px 16px;font-weight:600;margin-bottom:16px}
.verif-list{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:18px 0;padding:14px;background:var(--bg);border-radius:12px;font-size:13.5px}
.verif-list div::before{content:"✓ ";color:var(--ok);font-weight:800}
.review{border-top:1px solid var(--line);padding:10px 0;font-size:14px}
.review .rv-who{font-weight:700;font-size:13px}
.escrow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.escrow div{background:var(--bg);border-radius:12px;padding:12px;font-size:13px}
.escrow b{display:block;font-size:13.5px;margin-bottom:2px}

/* session */
.session-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px;padding:14px 18px}
.rec{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:#b91c1c;background:#fdecec;padding:4px 10px;border-radius:999px}
.rec::before{content:"";width:8px;height:8px;border-radius:50%;background:#dc2626;animation:blink 1.2s infinite}

.s-timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:18px;margin-left:auto}

.tool{border:1px solid var(--line);background:#fff;border-radius:9px;padding:5px 10px;font-size:13px;font-weight:600}

#board{display:block;width:100%;height:460px;touch-action:none;cursor:crosshair;background-color:#fff;background-image:linear-gradient(#eef2f8 1px,transparent 1px),linear-gradient(90deg,#eef2f8 1px,transparent 1px);background-size:24px 24px}

.vid{aspect-ratio:4/3;border-radius:14px;background:linear-gradient(160deg,#1e293b,#0f172a);position:relative;display:grid;place-items:center;overflow:hidden}
.vid .av{width:56px;height:56px;font-size:18px}
.vid.talk .av{animation:talk 1.4s infinite}
@keyframes talk{50%{box-shadow:0 0 0 10px rgba(34,197,94,.25)}}
.vid span{position:absolute;left:8px;bottom:8px;color:#fff;font-size:12px;font-weight:600;background:rgba(0,0,0,.4);padding:2px 8px;border-radius:6px}
.chat{padding:0;display:flex;flex-direction:column;height:330px}
.chat-box{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:85%;padding:9px 12px;border-radius:14px;font-size:14px}
.msg img{display:block;max-width:180px;border-radius:8px;margin-top:6px}
.msg.o{background:var(--bg);border-bottom-left-radius:4px}
.msg.me{background:var(--brand);color:#fff;margin-left:auto;border-bottom-right-radius:4px}
.msg.sys{align-self:center;background:none;color:var(--muted);font-size:12px;padding:2px}
.chat-form{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}
.chat-form input{flex:1}
.star-pick{display:flex;gap:6px;justify-content:center;margin:18px 0}
.star-pick button{background:none;border:0;font-size:40px;line-height:1;color:#d7dce6;padding:0 2px;transition:transform .1s}
.star-pick button.on{color:var(--accent)}
.star-pick button:hover{transform:scale(1.1)}
.spinner{width:42px;height:42px;border-radius:50%;border:4px solid var(--brand-soft);border-top-color:var(--brand);animation:spin .9s linear infinite;margin:0 auto 14px}
@keyframes spin{to{transform:rotate(360deg)}}

/* report */
.report{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff}
.report-head{padding:16px 18px;color:#fff;background:var(--c,var(--brand))}
.report-head h3{margin:0;font-size:18px}
.report-body{padding:16px 18px;font-size:14px}
.report-body h4{font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:14px 0 6px}
.report-body ul{margin:0;padding-left:18px}
.eval-row{display:flex;justify-content:space-between;padding:4px 0}
.sent{margin-top:14px;font-size:12.5px;color:var(--ok);font-weight:700;background:var(--ok-soft);padding:7px 10px;border-radius:8px}

.kid{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.rep-item{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;border:1px solid var(--line);margin-bottom:8px;background:#fff;width:100%;text-align:left}
.rep-item:hover{border-color:#b9c6e6;background:#fbfcff}

.rep-item .t{font-weight:700;font-size:14px}
.rep-item .s{font-size:12.5px;color:var(--muted)}
.new-dot{font-size:11px;font-weight:800;background:var(--brand);color:#fff;padding:2px 7px;border-radius:999px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;color:var(--muted);font-weight:600;font-size:12.5px;padding:8px 6px;border-bottom:1px solid var(--line)}
td{padding:10px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
.st{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.st.retenido{background:#e9effc;color:var(--brand)}
.st.revision{background:var(--accent-soft);color:#9a5b00}
.st.liberado{background:var(--ok-soft);color:var(--ok)}
.st.reembolsado{background:var(--bad-soft);color:var(--bad)}
.st.gratis{background:#eef1f6;color:#475569}

.hbar .row{justify-content:space-between;font-size:13.5px;font-weight:600}
.hbar .bar{height:10px}
.hbar .bar i{background:var(--c)}
.banner{display:flex;align-items:center;justify-content:space-between;gap:14px;background:linear-gradient(90deg,var(--brand),#4f78e8);color:#fff;border-radius:16px;padding:16px 20px;margin-bottom:20px;flex-wrap:wrap}

.toggle-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;font-size:14px}
.mini-switch{width:40px;height:22px;border-radius:99px;background:#cbd5e1;position:relative;border:0;padding:0}
.mini-switch::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}
.mini-switch.on{background:#22c55e}
.mini-switch.on::after{left:21px}
.switch{display:inline-flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 14px 6px 6px;font-weight:700;font-size:14px}

.switch .knob::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}

.calc .big{font-size:40px;font-weight:800;letter-spacing:-.02em;color:#0e9384}

#toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:80}
body.touring #toasts{bottom:150px}
.toast{background:var(--ink);color:#fff;padding:12px 16px;border-radius:12px;font-size:14px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.2);max-width:340px;animation:in .25s ease}

.toast.info::before{content:"● ";color:#93c5fd}
.toast.out{opacity:0;transform:translateY(8px);transition:.35s}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.45);display:grid;place-items:center;z-index:50;padding:16px}
.modal.hidden{display:none}
.modal-card{background:#fff;border-radius:20px;max-width:540px;width:100%;max-height:88vh;overflow:auto;padding:22px;box-shadow:0 30px 80px rgba(0,0,0,.25)}
#sim{position:fixed;left:16px;bottom:16px;z-index:70}
.sim-btn{background:var(--ink);color:#fff;border:0;border-radius:999px;padding:10px 16px;font-weight:700;font-size:13.5px;box-shadow:0 10px 30px rgba(0,0,0,.25);display:flex;align-items:center;gap:8px}
.sim-panel{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 20px 60px rgba(15,23,42,.25);width:300px;padding:16px;margin-bottom:10px}
.sim-panel h4{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:12px 0 6px}
.sim-panel .btn{width:100%;justify-content:flex-start;margin-bottom:6px}
#tour{position:fixed;left:0;right:0;bottom:0;z-index:75;background:var(--ink);color:#fff;box-shadow:0 -10px 40px rgba(0,0,0,.25)}
#tour.hidden{display:none}
.tour-in{max-width:1140px;margin:0 auto;padding:16px 20px;display:flex;gap:18px;align-items:center}
.tour-n{font-size:12px;font-weight:700;color:#94a3b8;white-space:nowrap}
.tour-tag{display:inline-block;background:var(--accent);color:#3b2600;font-size:11.5px;font-weight:800;padding:2px 9px;border-radius:999px;margin-right:8px}
.tour-txt{flex:1}
.tour-txt b{font-size:16px}
.tour-txt p{color:#cbd5e1;font-size:13.5px;margin-top:3px}
.tour-prog{height:3px;background:#334155}
.tour-prog i{display:block;height:100%;background:var(--accent);transition:width .3s}
.tour-ctrl{display:flex;gap:8px}
.tour-ctrl button{background:#1e293b;border:1px solid #334155;color:#fff;border-radius:10px;padding:8px 12px;font-weight:700;font-size:13px}
.tour-ctrl button.main{background:var(--accent);border-color:var(--accent);color:#3b2600}

@media (max-width:920px){
  .hero-grid,.grid-2-1,.session-grid,.devices,.faq-grid{grid-template-columns:1fr}
  .phone{margin:0 auto}
  .steps,.feat-grid,.price-grid,.kpis,.trust-grid,.testi-grid{grid-template-columns:1fr 1fr}
  .hero h1{font-size:34px}
  .pubnav{display:none}
  .top .wrap > .row{margin-left:auto}
  .tour-in{flex-wrap:wrap}
}
@media (max-width:620px){
  .role-ctas,.who-grid,.fgrid,.verif-list,.escrow,.req-grid{grid-template-columns:1fr}
  .dur-grid{grid-template-columns:1fr 1fr}
  .steps,.feat-grid,.price-grid,.trust-grid,.testi-grid{grid-template-columns:1fr}
  #board{height:340px}
  .role-pill{display:none}
  .user-chip span{display:none}
  .sim-panel{width:calc(100vw - 32px)}
}
</style>

const $ = (s, r = document) => r.querySelector(s);

function handleRegForm() {
  const R = S.reg, d = R.d, v = id => ($('#' + id)?.value || '').trim(), errs = [];
  const isMail = x => /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(x), isPhone = x => x.replace(/\D/g, '').length >= 9;
  if (R.who === 'padre') {
    if (R.step === 1) {
      Object.assign(d, { pName: v('pName'), pEmail: v('pEmail'), pPhone: v('pPhone'), pPass: v('pPass') });
      if (!d.pName) errs.push('escribe tu nombre'); if (!isMail(d.pEmail)) errs.push('revisa el correo'); if (!isPhone(d.pPhone)) errs.push('revisa el celular'); if (d.pPass.length < 6) errs.push('la contraseña debe tener al menos 6 caracteres');
    } else if (R.step === 2) {
      Object.assign(d, { cName: v('cName'), cCurso: v('cCurso'), cBirth: v('cBirth'), cColegio: v('cColegio'), cSubj: $$('input[name=cSubj]:checked').map(x => x.value) });
      if (!d.cName) errs.push('escribe el nombre de tu hijo'); if (!d.cBirth) errs.push('indica su fecha de nacimiento');
    } else if (R.step === 3) {
      Object.assign(d, { kData: $('#kData').checked, kRec: $('#kRec').checked, kMail: $('#kMail').checked, kWa: $('#kWa').checked });
      if (!d.kData) errs.push('autoriza el tratamiento de datos'); if (!d.kRec) errs.push('autoriza la grabación de sesiones');
    } else if (R.step === 4) {
      d.method = $('input[name=method]:checked').value;
    }
    if (errs.length) return showErr(errs);
    if (R.step < 4) { R.step++; return render(); }
    S.parent = { name: d.pName, email: d.pEmail, phone: d.pPhone, pass: d.pPass, method: d.method, notify: { email: d.kMail, wa: d.kWa } };
    const parts = d.cName.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').split(/\s+/);
    S.child = { name: d.cName, user: parts[0] + (parts[1] ? '.' + parts[1] : ''), pass: 'Poli-' + Math.floor(1000 + Math.random() * 9000), curso: d.cCurso, colegio: d.cColegio, birth: d.cBirth,
      subjects: d.cSubj, status: 'activo', trialUsed: false, rep: { punt: [], resp: [], cons: [] } };
    S.reports = []; S.payments = []; resetFlow();
    R.step = 'done'; render(); toast('Cuenta familiar creada');
  } else {
    if (R.step === 1) {
      Object.assign(d, { sName: v('sName'), sCurso: v('sCurso'), sBirth: v('sBirth'), sEmail: v('sEmail'), sPass: v('sPass') });
      if (!d.sName) errs.push('escribe tu nombre'); if (!d.sBirth) errs.push('indica tu fecha de nacimiento'); if (!d.sEmail) errs.push('escribe tu correo o usuario'); if (d.sPass.length < 6) errs.push('la contraseña debe tener al menos 6 caracteres');
    } else {
      Object.assign(d, { rName: v('rName'), rEmail: v('rEmail'), rPhone: v('rPhone') });
      if (!d.rName) errs.push('escribe el nombre de tu representante'); if (!isMail(d.rEmail)) errs.push('revisa el correo del representante'); if (!isPhone(d.rPhone)) errs.push('revisa el celular del representante');
    }
    if (errs.length) return showErr(errs);
    if (R.step === 1) { R.step = 2; return render(); }
    S.child = { name: d.sName, user: d.sEmail, pass: d.sPass, curso: d.sCurso, colegio: '', birth: d.sBirth, subjects: [], status: 'pendiente', trialUsed: false, rep: { punt: [], resp: [], cons: [] } };
    S.parent = { name: d.rName, email: d.rEmail, phone: d.rPhone, pending: true, notify: { email: true, wa: true } };
    S.reports = []; S.payments = []; resetFlow();
    R.step = 'done'; render(); toast('Invitación enviada a tu representante');
  }
}
function showErr(errs) { const e = $('#fErr'); if (e) e.innerHTML = `<div class="err">Para continuar: ${errs.join('; ')}.</div>`; }

  const T = S.treg, d = T.d, v = id => ($('#' + id)?.value || '').trim(), errs = [];
  if (T.step === 1) {
    Object.assign(d, { tName: v('tName'), tEmail: v('tEmail').toLowerCase(), tPhone: v('tPhone'), tPass: v('tPass') });
    if (!d.tName) errs.push('escribe tu nombre'); if (!/^[^@\s]+@espol\.edu\.ec$/.test(d.tEmail)) errs.push('usa tu correo @espol.edu.ec');
    if (d.tPhone.replace(/\D/g, '').length < 9) errs.push('revisa el celular'); if (d.tPass.length < 6) errs.push('la contraseña debe tener al menos 6 caracteres');
  } else if (T.step === 2) {
    d.files = d.files || {};
    ['fCedF', 'fCedB', 'fSelf', 'fMat', 'fRec'].forEach(id => { const f = $('#' + id).files[0]; if (f) d.files[id] = f.name; });
    const lab = { fCedF: 'cédula (frente)', fCedB: 'cédula (reverso)', fSelf: 'selfie', fMat: 'matrícula vigente', fRec: 'récord académico' };
    Object.keys(lab).forEach(id => { if (!d.files[id]) errs.push('sube ' + lab[id]); });
  } else if (T.step === 3) {
    d.subj = {};
    $$('input[name=tS]:checked').forEach(x => { d.subj[x.value] = parseFloat(v('g_' + x.value)); });
    const ks = Object.keys(d.subj);
    if (!ks.length) errs.push('elige al menos una materia');
    ks.forEach(k => { if (isNaN(d.subj[k])) errs.push('ingresa tu nota en ' + SUBJECTS[k].name); else if (d.subj[k] < 8) errs.push(`necesitas 8/10 en ${SUBJECTS[k].name} (tienes ${d.subj[k]})`); });
  } else if (T.step === 4) {
    d.quiz = {};
    Object.keys(d.subj).forEach(k => { const c = $(`input[name=q_${k}]:checked`); d.quiz[k] = c ? +c.value : null; if (d.quiz[k] === null) errs.push('responde ' + SUBJECTS[k].name); else if (d.quiz[k] !== QUIZ[k].a) errs.push(`revisa tu respuesta de ${SUBJECTS[k].name}`); });
  } else {
    d.coc = $('#tCoc').checked; d.bank = v('tBank'); d.type = v('tType');
    if (!d.coc) errs.push('acepta el código de conducta');
  }
  if (errs.length) return showErr(errs);
  if (T.step < 5) { T.step++; return render(); }
  S.tutor = makeTutor({ name: d.tName, email: d.tEmail, phone: d.tPhone, pass: d.tPass, grades: { ...d.subj }, bank: d.bank, status: 'revision' });
  S.user = 'tutor'; S.treg = { step: 1, d: { subj: {} } };
  go('tutor'); toast('Solicitud enviada a verificación');
}

function pushChat(m) { if (!S.live) return; S.live.chat.push(m); const b = $('#chatBox'); if (b) { b.insertAdjacentHTML('beforeend', chatMsg(m)); b.scrollTop = b.scrollHeight; } }
function autoReply() {
  const L = S.live; if (!L) return;
  setTimeout(() => { if (S.live !== L) return; const list = L.role === 'student' ? REPLIES : STUDENT_MSGS; pushChat({ from: 'o', text: list[L.ri % list.length] }); L.ri++; }, 1100);
}
function setupLive() {
  const L = S.live;
  const tick = () => { const s = (Date.now() - L.start) / 1000; const el = $('#sTimer'); if (el) { el.textContent = `${fmt(s)} / ${L.min}:00`; el.style.color = s >= L.min * 60 ? 'var(--bad)' : ''; } };
  tick(); every(tick, 1000);
  const box = $('#chatBox'); box.scrollTop = box.scrollHeight;
  const c = $('#board'), rect = c.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  c.width = rect.width * dpr; c.height = rect.height * dpr;
  const ctx = c.getContext('2d'); ctx.scale(dpr, dpr); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const save = () => { try { L.board = c.toDataURL(); } catch (e) {} };
  if (L.board) { const img = new Image(); img.onload = () => ctx.drawImage(img, 0, 0, rect.width, rect.height); img.src = L.board; }
  else { ctx.fillStyle = '#94a3b8'; ctx.font = '600 14px "Plus Jakarta Sans", sans-serif'; ctx.fillText('Tema: ' + L.topic, 18, 28); save(); }
  if (L.role === 'student' && !L.drew) later(() => {
    L.drew = true; const cur = $('#board'); if (!cur) return; const cx = cur.getContext('2d');
    cx.globalCompositeOperation = 'source-over'; cx.fillStyle = L.oColor; cx.font = '600 22px "Plus Jakarta Sans", sans-serif';
    BOARD_EX[L.subj].forEach((line, i) => cx.fillText(line, 28, 80 + i * 40));
    cx.font = '500 12px "Plus Jakarta Sans", sans-serif'; cx.fillText('— escrito por ' + first(L.oName), 28, 80 + BOARD_EX[L.subj].length * 40);
    try { L.board = cur.toDataURL(); } catch (e) {}
    pushChat({ from: 'sys', text: 'El tutor escribió en la pizarra' });
  }, 2500);
  let drawing = false, last = null;
  const pos = e => { const b = c.getBoundingClientRect(); return { x: e.clientX - b.left, y: e.clientY - b.top }; };
  c.onpointerdown = e => { drawing = true; last = pos(e); try { c.setPointerCapture(e.pointerId); } catch (_) {} };
  c.onpointermove = e => { if (!drawing) return; const p = pos(e);
    ctx.globalCompositeOperation = pen.erase ? 'destination-out' : 'source-over'; ctx.strokeStyle = pen.c; ctx.lineWidth = pen.erase ? 24 : 3;
    ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke(); last = p; };
  const end = () => { if (drawing) { drawing = false; save(); } };
  c.onpointerup = end; c.onpointercancel = end;
}

AFTER.tutor = () => {
  const T = S.tutor;
  if (!T || T.status !== 'verificado') return;
  if (T.view === 'session') return setupLive();
  if (T.view !== 'panel') return;
  if (T.online && !T.pending) later(() => {
    const pool = REQS.filter(r => T.grades[r.subj] !== undefined);
    T.pending = { ...pick(pool.length ? pool : REQS), left: 30 }; render(); toast('Nueva solicitud de tutoría', 'info');
  }, 3500);
  if (T.pending) every(() => {
    T.pending.left--; const el = $('#reqT'); if (el) el.textContent = T.pending.left;
    if (T.pending.left <= 0) { T.pending = null; render(); toast('La solicitud expiró y pasó a otro tutor', 'info'); }
  }, 1000);
};

  tourPrev: () => tourGo(Math.max(0, S.tour.i - 1)),
  tourAuto: () => { S.tour.auto = !S.tour.auto; renderTour(); if (S.tour.auto) scheduleTour(); else clearTimeout(tourTimer); },
  tourExit: () => { clearTimeout(tourTimer); S.tour.on = false; S.tour.auto = false; document.body.classList.remove('touring'); renderTour(); renderSim(); }
};
function keepComment() { const c = $('#comment'); if (c) S.flow.comment = c.value; }
function openReportModal(r) {
  openModal(`${reportHTML(r)}
    <div class="card" style="margin-top:12px;padding:14px;box-shadow:none"><div class="row between wrapf gap"><b style="font-size:14px">Califica al tutor como representante</b><span class="star-pick" style="margin:0">${[1, 2, 3, 4, 5].map(n => `<button style="font-size:26px" class="${n <= (r.pStars || 0) ? 'on' : ''}" data-act="pStar" data-id="${r.id}" data-n="${n}">★</button>`).join('')}</span></div></div>
    <div class="row gap end wrapf" style="margin-top:14px">${S.payments.find(p => p.id === r.payId && p.status === 'revision') ? `<button class="btn danger" data-act="claim" data-id="${r.payId}">Reportar un problema</button>` : ''}<button class="btn ghost" data-act="copyReport" data-id="${r.id}">Copiar</button><button class="btn primary" data-act="closeModal">Cerrar</button></div>`);
}
function claimModal(id) {
  const p = S.payments.find(x => x.id === id);
  return `<h3 style="font-size:19px">Reportar un problema</h3><p class="muted tiny" style="margin:4px 0 14px">El pago de ${money(p.amount)} sigue protegido. Revisaremos la grabación de la sesión.</p>
    <label class="lbl">¿Qué pasó?</label><select id="cReason"><option>El tutor no se presentó</option><option>La sesión no resolvió la duda</option><option>Problemas técnicos</option><option>Comportamiento inapropiado</option><option>Otro</option></select>
    <label class="lbl" style="margin-top:12px">Detalles (opcional)</label><textarea rows="3" placeholder="Cuéntanos más"></textarea>
    <div class="row gap end" style="margin-top:14px"><button class="btn ghost" data-act="closeModal">Cancelar</button><button class="btn danger" data-act="sendClaim" data-id="${id}">Enviar y pedir reembolso</button></div>`;
}

/* =========================================================
   Simulación guiada
   ========================================================= */
let tourTimer = null;
function prepForm() { ensureDemo(); S.user = 'student'; resetFlow(); Object.assign(S.flow, { subj: 'mat', topic: 'Derivadas', detail: 'No entiendo cuándo usar la regla de la cadena', dur: 1 }); }
function prepMatching() { prepForm(); confirmRequest(); }
function prepMatch() { prepMatching(); S.flow.matchStart = Date.now() - 42000; foundTutor(); }
function prepSession() { prepMatch(); startStudentLive(); }
function prepRate() { prepSession(); Object.assign(S.flow, { elapsed: 1712, step: 'rate', stars: 5, tags: ['Paciencia', 'Claridad'], comment: 'Me explicó la regla de la cadena con ejemplos.' }); }
function ensureRevision() { if (!S.payments.some(p => p.status === 'revision')) { prepRate(); finishStudentSession(); } }
const TOUR = [
  { tag: 'Homepage', t: 'Explica todo y separa los dos caminos', d: 'Arriba, dos entradas: “¿Eres padre o estudiante? Crea tu cuenta aquí” y “¿Eres estudiante ESPOL? Hazte tutor aquí”.', run: () => { S.user = null; go('inicio'); setTimeout(() => window.scrollTo(0, 0), 50); } },
  { tag: 'Registro familiar', t: '¿Quién crea la cuenta?', d: 'El representante (recomendado) o el estudiante, que luego invita a su representante para que apruebe.', run: () => { S.user = null; S.reg = { who: null, step: 1, d: { cSubj: [] } }; go('registro-familia'); } },
  { tag: 'Registro familiar', t: 'El padre agrega a su hijo', d: 'El representante es el titular: paga y recibe reportes. Crea el perfil del hijo con su curso y materias.', run: () => { S.user = null; S.reg = { who: 'padre', step: 2, d: { pName: 'Ana Vera', pEmail: 'ana.vera@gmail.com', pPhone: '0991234567', pPass: 'demo123', cName: 'Mateo Vera', cCurso: CURSOS[1], cBirth: '2010-03-14', cSubj: ['mat', 'fis'] } }; go('registro-familia'); } },
  { tag: 'Seguridad', t: 'Consentimiento de datos y grabación', d: 'Antes de activar la cuenta, el representante autoriza el tratamiento de datos (LOPDP) y la grabación de sesiones.', run: () => { S.user = null; S.reg = { who: 'padre', step: 3, d: { pName: 'Ana Vera', cName: 'Mateo Vera', cBirth: '2010-03-14', cSubj: ['mat'], kData: true, kRec: true } }; go('registro-familia'); } },
  { tag: 'Atributo 2', t: 'Pedir ayuda: materia, tema, foto y duración', d: 'El estudiante elige bloques de 30, 45 o 60 min (o la prueba gratis de 15). Puede subir una foto del ejercicio.', run: () => { prepForm(); go('estudiante'); } },
  { tag: 'Atributo 1', t: 'Emparejamiento en menos de 3 minutos', d: 'Se notifica primero a los tutores mejor calificados en el tema. El primero que acepta toma la sesión.', ms: 8000, run: () => { prepMatching(); go('estudiante'); } },
  { tag: 'Atributos 3 y 7', t: 'Tutor verificado, con notas y reseñas', d: 'Insignias por materia, verificación visible, calificación promedio y número de reseñas.', run: () => { prepMatch(); go('estudiante'); } },
  { tag: 'Atributo 2', t: 'Sesión en vivo con pizarra y chat', d: 'Video, chat interno y pizarra compartida. Se graba por seguridad y se puede extender +15 min con aprobación del padre.', ms: 9000, run: () => { prepSession(); go('estudiante'); tourT(() => { pushChat({ from: 'me', text: '¿Por qué se multiplica por 6x?' }); autoReply(); }, 3800); } },
  { tag: 'Atributo 7', t: 'Calificación obligatoria al cerrar', d: 'El estudiante califica de 1 a 5 y deja un comentario. El padre también puede calificar desde el reporte.', run: () => { prepRate(); go('estudiante'); } },
  { tag: 'Atributo 5', t: 'Reporte automático para el representante', d: 'Temas reforzados, próximos pasos y compromiso del estudiante, por correo y WhatsApp.', run: () => { ensureDemo(); prepRate(); finishStudentSession(); S.user = 'parent'; go('padre'); tourT(() => { const r = S.reports[0]; r.seen = true; openReportModal(r); }, 250); } },
  { tag: 'Atributo 4', t: 'Pago protegido con ventana de reclamo', d: 'El pago queda retenido durante la sesión y se libera 24 h después. El padre puede reportar un problema y pedir reembolso.', run: () => { ensureDemo(); ensureRevision(); S.user = 'parent'; go('padre'); tourT(() => { closeModal(); $('#pagos')?.scrollIntoView({ behavior: 'smooth' }); }, 250); } },
  { tag: 'Atributo 3', t: 'El tutor demuestra que está calificado', d: 'Correo ESPOL, cédula con selfie, matrícula, récord, nota mínima 8/10 por materia y una prueba corta.', run: () => { S.user = null; S.treg = { step: 3, d: { tName: 'Carlos Rivas', tEmail: 'carivas@espol.edu.ec', tPhone: '0987654321', tPass: 'demo123', files: { fCedF: 'cedula_frente.jpg', fCedB: 'cedula_reverso.jpg', fSelf: 'selfie.jpg', fMat: 'matricula_2026.pdf', fRec: 'record.pdf' }, subj: { mat: 9.1, fis: 8.8 } } }; go('registro-tutor'); } },
  { tag: 'Oferta', t: 'El tutor se pone en línea y acepta', d: 'Recibe solicitudes solo de sus materias, con 30 s para aceptar. Ve cuánto recibe y su dinero retenido, por liberar y liberado.', run: () => { ensureDemo(); S.user = 'tutor'; const T = S.tutor; T.view = 'panel'; T.online = true; T.active = null; T.pending = { ...(REQS.find(r => T.grades[r.subj] !== undefined) || REQS[1]), left: 30 }; go('tutor'); } },
  { tag: 'Atributo 8', t: 'Insignias positivas del estudiante', d: 'Puntual, respetuoso y constante, según la evaluación del tutor. Solo las ven el estudiante, su representante y el tutor asignado.', run: () => { ensureDemo(); S.user = 'student'; resetFlow(); go('estudiante'); tourT(() => $('#badges')?.scrollIntoView({ behavior: 'smooth', block: 'center' }), 250); } },
  { tag: 'Atributo 6', t: 'App liviana y acceso web', d: 'Menos de 50 MB y versión web responsive. Fin de la simulación: puedes explorar libremente desde el simulador.', run: () => { S.user = null; go('inicio'); S.pendingScroll = 'dispositivos'; tourT(() => AFTER.inicio(), 200); } }
];
let tourTs = [];
function tourT(fn, ms) { tourTs.push(setTimeout(fn, ms)); }
function tourGo(i) {
  if (i >= TOUR.length) return ACT.tourExit();
  tourTs.forEach(clearTimeout); tourTs = []; clearTimeout(tourTimer);
  closeModal(); S.tour.on = true; S.tour.i = i; S.simOpen = false; document.body.classList.add('touring');
  TOUR[i].run(); renderTour(); renderSim();
  if (S.tour.auto) scheduleTour();
}
function scheduleTour() { clearTimeout(tourTimer); tourTimer = setTimeout(() => tourGo(S.tour.i + 1), TOUR[S.tour.i].ms || 7000); }
function renderTour() {
  const el = $('#tour');
  if (!S.tour.on) { el.classList.add('hidden'); return; }
  const s = TOUR[S.tour.i], last = S.tour.i === TOUR.length - 1;
  el.classList.remove('hidden');
  el.innerHTML = `<div class="tour-prog"><i style="width:${(S.tour.i + 1) / TOUR.length * 100}%"></i></div><div class="tour-in">
    <span class="tour-n">${S.tour.i + 1} / ${TOUR.length}</span>
    <div class="tour-txt"><span class="tour-tag">${s.tag}</span><b>${s.t}</b><p>${s.d}</p></div>
    <div class="tour-ctrl"><button data-act="tourPrev" ${S.tour.i ? '' : 'disabled'}>◀</button><button data-act="tourAuto">${S.tour.auto ? '❚❚ Pausar' : '▶ Auto'}</button>
    <button class="main" data-act="${last ? 'tourExit' : 'tourNext'}">${last ? 'Terminar' : 'Siguiente ▶'}</button><button data-act="tourExit" aria-label="Salir">✕</button></div></div>`;
}

/* =========================================================
   Eventos y router
   ========================================================= */
document.addEventListener('click', e => {
  if (e.target.id === 'modal') return closeModal();
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  if (el.closest('.sim-panel') && el.dataset.act !== 'simToggle') S.simOpen = false;
  const fn = ACT[el.dataset.act]; if (fn) { e.preventDefault(); fn(el, e); renderSim(); }
});
document.addEventListener('input', e => { if (e.target.id === 'detail') S.flow.detail = e.target.value; if (e.target.id === 'tObs' && S.tutor?.active) S.tutor.active.obs = e.target.value; });
document.addEventListener('submit', e => {
  e.preventDefault();
  const id = e.target.id;
  if (id === 'regForm') return handleRegForm();
  if (id === 'tregForm') return handleTregForm();
  if (id === 'chatForm') { const inp = $('#chatIn'), txt = inp.value.trim(); if (!txt) return; inp.value = ''; pushChat({ from: 'me', text: txt }); autoReply(); return; }
  if (id === 'loginForm') {
    const u = $('#lUser').value.trim().toLowerCase(), pw = $('#lPass').value;
    const cand = [['parent', S.parent && !S.parent.pending && S.parent.email], ['student', S.child && S.child.user], ['tutor', S.tutor && S.tutor.email]].find(([, x]) => x && x.toLowerCase() === u);
    if (!cand) return showErr(['no encontramos esa cuenta (usa las cuentas de esta simulación)']);
    const acc = { parent: S.parent, student: S.child, tutor: S.tutor }[cand[0]];
    if (acc.pass && acc.pass !== pw) return showErr(['contraseña incorrecta']);
    return login(cand[0]);
  }
  if (id === 'inviteForm') {
    const errs = []; if (($('#iPass').value || '').length < 6) errs.push('crea una contraseña de al menos 6 caracteres');
    if (!$('#iData').checked) errs.push('autoriza el tratamiento de datos'); if (!$('#iRec').checked) errs.push('autoriza la grabación');
    if (errs.length) return showErr(errs);
    Object.assign(S.parent, { name: $('#iName').value.trim() || S.parent.name, pass: $('#iPass').value, method: $('input[name=method]:checked').value, pending: false });
    S.child.status = 'activo'; login('parent'); toast(`Aprobaste la cuenta de ${first(S.child.name)}`); return;
  }
  if (id === 'tReportForm') {
    const T = S.tutor, a = T.active;
    if (!tEval.punt || !tEval.resp || !tEval.cons) return showErr(['califica puntualidad, respeto y constancia']);
    const l = T.ledger.find(x => x.id === a.id); if (l) l.status = 'revision';
    T.sessions++; T.active = null; T.view = 'panel'; render();
    toast(`Reporte enviado al representante de ${a.name}`);
    setTimeout(() => { T.reviews.unshift({ by: first(a.name) + ' (estudiante)', stars: pick([5, 5, 4]), text: pick(['Explica muy claro, gracias.', 'Muy paciente, entendí todo.', 'Buena clase, me ayudó para la prueba.']) }); if (route() === 'tutor' && T.view === 'panel') render(); toast('Recibiste una nueva reseña', 'info'); }, 2500);
  }
});
function openModal(html) { $('#modalCard').innerHTML = html; $('#modal').classList.remove('hidden'); }
function closeModal() { $('#modal').classList.add('hidden'); }
function toast(msg, kind = 'ok') {
  const el = document.createElement('div'); el.className = 'toast ' + kind; el.textContent = msg; $('#toasts').appendChild(el);
  setTimeout(() => el.classList.add('out'), 3200); setTimeout(() => el.remove(), 3600);
}
const ROUTES = ['inicio', 'tutores', 'registro-familia', 'registro-tutor', 'ingresar', 'invitacion', 'padre', 'estudiante', 'tutor'];
const PRIVATE = { padre: 'parent', estudiante: 'student', tutor: 'tutor' };
function route() { const h = location.hash.slice(1); return ROUTES.includes(h) ? h : 'inicio'; }
function go(r) { if (location.hash === '#' + r) render(); else location.hash = r; }
function render() {
  ticks.forEach(id => { clearInterval(id); clearTimeout(id); }); ticks = [];
  let r = route();
  if (PRIVATE[r] && (S.user !== PRIVATE[r] || !{ parent: S.parent, student: S.child, tutor: S.tutor }[PRIVATE[r]])) {
    S.gateMsg = { padre: 'Ingresa con la cuenta del representante para ver este panel.', estudiante: 'Ingresa con la cuenta del estudiante.', tutor: 'Ingresa con tu cuenta de tutor.' }[r];
    r = 'ingresar';
  } else if (r !== 'ingresar') S.gateMsg = null;
  renderTop(); renderSim();
  $('#app').innerHTML = VIEWS[r]();
  (AFTER[r] || (() => {}))();
}
window.addEventListener('hashchange', () => { if (!S.tour.on) closeModal(); render(); if (!S.pendingScroll) window.scrollTo(0, 0); });
render();
</script>
