<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PoliTutors — Prototipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,100..125,400..800;1,100..125,400..600&family=Chivo+Mono:wght@400;500&family=Alegreya:ital,wght@1,500&display=swap" rel="stylesheet">
<style>
/* =========================================================
   PoliTutors · Cuaderno politécnico (ver DESIGN.md)
   ========================================================= */
:root{
  --paper:#F7F5F0; --sheet:#FFFFFF;
  --ink:#0E1F3D; --ink-2:#2B3A55; --muted:#56627A;
  --line:rgba(14,31,61,.14); --line-2:rgba(14,31,61,.28);
  --azul:#1D4EA2; --azul-d:#163C7E; --azul-t:#E9EFF8;
  --celeste:#00B2E9; --celeste-d:#0077A8; --celeste-p:#DDF1FB;
  --amber:#F2C14E; --red:#B8360A; --red-t:#FBEDE6;
  --ok:#1E6B47; --ok-t:#E6F1EA;
  --grid:rgba(0,178,233,.16);
  --f-ui:'Archivo',system-ui,sans-serif; --f-mono:'Chivo Mono',ui-monospace,monospace; --f-note:'Alegreya',Georgia,serif;
  --r:4px;
  /* alias de compatibilidad */
  --brand:var(--azul); --brand-2:var(--azul-d); --brand-soft:var(--azul-t); --accent:var(--amber); --accent-soft:#FBF0D3;
  --bg:var(--paper); --card:var(--sheet); --ok-soft:var(--ok-t); --bad:var(--red); --bad-soft:var(--red-t);
}
*{box-sizing:border-box}
html,body{margin:0}
html{scroll-behavior:smooth;scroll-padding-top:80px}
body{font-family:var(--f-ui);background:var(--paper);color:var(--ink);font-size:15.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
body.touring{padding-bottom:150px}
a{color:var(--azul);text-decoration-thickness:1.5px;text-underline-offset:3px}
button{font:inherit;cursor:pointer;color:inherit}
button:disabled{cursor:not-allowed}
:focus-visible{outline:2px solid var(--celeste-d);outline-offset:2px}
h1,h2,h3,h4{margin:0;line-height:1.15;letter-spacing:-.01em;font-weight:700}
h1,h2{font-stretch:115%;font-weight:800;letter-spacing:-.025em}
h3{font-size:16px;margin:2px 0 12px}
p{margin:0}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.muted{color:var(--muted)} .tiny{font-size:13px} .center{text-align:center}
.row{display:flex;align-items:center} .gap{gap:12px} .wrapf{flex-wrap:wrap} .end{justify-content:flex-end} .between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:16px}
.mono{font-family:var(--f-mono)}
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
.ic.lg{width:28px;height:28px}
.hl{background:linear-gradient(transparent 58%,rgba(242,193,78,.75) 58%,rgba(242,193,78,.75) 92%,transparent 92%);padding:0 .08em;color:inherit}
.gridbg{background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
.hatch{background-image:repeating-linear-gradient(133deg,rgba(29,78,162,.07) 0 1px,transparent 1px 9px)}

/* barra superior */
.top{position:sticky;top:0;z-index:20;background:rgba(247,245,240,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:18px;height:62px}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:20px;text-decoration:none;letter-spacing:-.03em;font-stretch:112%;color:var(--ink)}
.mark{width:30px;height:30px;display:block;flex:none}
.logo .t2{color:var(--azul)}
.pubnav{display:flex;gap:2px;margin-left:auto}
.link{background:none;border:0;text-decoration:none;padding:8px 12px;border-radius:var(--r);font-weight:500;color:var(--ink-2);font-size:14.5px}
.link:hover{color:var(--azul);text-decoration:underline;text-underline-offset:5px}
.role-pill{font-family:var(--f-mono);font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--celeste-d);border-left:1px solid var(--line-2);padding-left:12px}
.user-chip{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px}

/* botones */
.btn{border:1.5px solid transparent;border-radius:var(--r);padding:11px 18px;min-height:44px;font-weight:600;font-size:15px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:background .15s ease-out,transform .1s ease-out,border-color .15s;white-space:nowrap;line-height:1.2}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn.primary{background:var(--azul);color:#fff}
.btn.primary:hover:not(:disabled){background:var(--azul-d)}
.btn.primary:disabled{background:#AEBBD4;color:#F4F6FA}
.btn.ghost{background:transparent;border-color:var(--ink);color:var(--ink)}
.btn.ghost:hover{background:var(--sheet)}
.btn.danger{background:transparent;border-color:var(--red);color:var(--red)}
.btn.ok{background:var(--ok);color:#fff}
.btn.dark{background:var(--ink);color:#fff}
.btn.lg{padding:13px 22px;font-size:16px;min-height:50px}
.btn.block{width:100%}
.btn.sm{padding:7px 12px;font-size:13.5px;min-height:36px}

/* hojas, etiquetas, chips */
.card{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.pill{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:11.5px;font-weight:500;text-transform:uppercase;letter-spacing:.07em;color:var(--celeste-d);background:none;padding:0}
.pill::before{content:"";width:6px;height:6px;background:currentColor;flex:none}
.pill.amber{color:#8A5A00}
.eyebrow{font-family:var(--f-mono);font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--celeste-d)}
.chip{border:1px solid var(--line-2);background:var(--sheet);border-radius:var(--r);padding:7px 12px;font-size:14px;font-weight:500;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.chip:hover{border-color:var(--azul)}
.chip.on,.chip:has(input:checked){background:var(--azul);border-color:var(--azul);color:#fff}
.chip input{display:none}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
input[type=text],input[type=email],input[type=tel],input[type=password],input[type=number],input[type=date],select{width:100%;border:0;border-bottom:1.5px solid var(--ink);border-radius:0;padding:10px 2px;font:inherit;font-size:16px;background:transparent;color:var(--ink)}
select{border:1px solid var(--line-2);border-radius:var(--r);padding:10px 12px;background:var(--sheet)}
textarea{width:100%;border:1px solid var(--line-2);border-radius:var(--r);padding:6px 12px;font:inherit;font-size:15.5px;line-height:28px;color:var(--ink);resize:vertical;background:var(--sheet) linear-gradient(transparent 27px,rgba(0,178,233,.28) 27px) 0 5px/100% 28px local}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--azul);box-shadow:0 1.5px 0 var(--azul)}
textarea:focus,select:focus{box-shadow:0 0 0 1px var(--azul)}
input::placeholder,textarea::placeholder{color:#8B94A6}
label.lbl{display:block;font-weight:600;font-size:13.5px;margin:0 0 2px;color:var(--ink-2)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px 20px}
.fgrid .full{grid-column:1/-1}
.hint{font-size:13px;color:var(--muted);margin-top:6px}
.check{display:flex;gap:12px;align-items:flex-start;padding:12px 2px;border:0;border-bottom:1px solid var(--line);font-size:15px;cursor:pointer}
.check input{margin-top:3px;width:18px;height:18px;flex:none;accent-color:var(--azul)}
.check small{display:block;color:var(--muted);font-size:13px}
.err{color:var(--red);border-left:3px solid var(--red);background:var(--red-t);padding:9px 12px;font-size:14px;font-weight:500;margin-top:14px}
.err::before{content:"Corrige: ";font-weight:700}
.note{border-left:3px solid var(--amber);background:#FBF3DE;color:#5E4300;padding:10px 14px;font-size:13.5px}
.info{border-left:3px solid var(--celeste);background:var(--celeste-p);color:var(--ink);padding:11px 14px;font-size:14px}

/* hero */
.hero{padding:56px 0 44px;border-bottom:1px solid var(--line)}
.hero-grid{display:grid;grid-template-columns:1.25fr .75fr;gap:48px;align-items:start}
.hero h1{font-size:52px;line-height:1.02;margin:14px 0 16px;max-width:15ch}
.lead{font-size:18px;color:var(--ink-2);max-width:56ch;margin-bottom:26px}
.role-ctas{display:grid;grid-template-columns:1.15fr .85fr;gap:0;border:1px solid var(--ink);border-radius:var(--r);background:var(--sheet)}
.role-cta{display:flex;flex-direction:column;gap:8px;text-decoration:none;color:var(--ink);padding:20px 22px;transition:background .15s ease-out}
.role-cta + .role-cta{border-left:1px solid var(--ink)}
.role-cta:hover{background:var(--azul-t)}
.role-cta .q{font-family:var(--f-mono);font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--celeste-d)}
.role-cta .a{font-size:22px;font-weight:800;font-stretch:112%;letter-spacing:-.02em}
.role-cta ul{list-style:none;padding:0;margin:4px 0 4px;font-size:14px;color:var(--ink-2)}
.role-cta li{padding:5px 0 5px 22px;border-top:1px solid var(--line);position:relative}
.role-cta li::before{content:"";position:absolute;left:2px;top:11px;width:9px;height:5px;border-left:1.6px solid var(--ok);border-bottom:1.6px solid var(--ok);transform:rotate(-45deg)}
.role-cta .go{margin-top:auto;color:var(--azul);font-weight:700;font-size:15px;display:flex;align-items:center;gap:6px}
.role-cta.tut{background:var(--paper)}
.role-cta.tut:hover{background:var(--celeste-p)}
.role-cta .stat{font-family:var(--f-mono);font-size:13px;color:var(--ink-2);border-top:1px solid var(--line);padding-top:8px}
.trust{display:flex;flex-wrap:wrap;gap:6px 20px;margin-top:16px;font-size:13.5px;color:var(--ink-2)}
.trust span{display:inline-flex;align-items:center;gap:6px}
.demo-link{background:none;border:0;color:var(--ink);font-weight:600;font-size:14.5px;padding:0;margin-top:18px;display:inline-flex;gap:10px;align-items:center;text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1.5px}
.demo-link span{width:28px;height:28px;border:1.5px solid var(--ink);border-radius:50%;display:grid;place-items:center;font-size:10px;text-decoration:none}
.phone{position:relative;background:var(--sheet);border:1px solid var(--line-2);border-radius:var(--r);padding:22px 20px 18px;max-width:340px;margin:28px 0 0 auto;transform:rotate(1.2deg)}
.phone::before{content:"";position:absolute;top:-12px;left:50%;width:96px;height:24px;margin-left:-48px;background:rgba(242,193,78,.55);transform:rotate(-3deg)}
.phone .ok-bar{font-family:var(--f-mono);font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--ok);margin-bottom:14px;position:relative;display:inline-block}
.phone .ok-bar b{font-size:20px;letter-spacing:0;color:var(--ink);margin-left:6px;position:relative}
.annot{position:absolute;pointer-events:none;overflow:visible}
.annot path{fill:none;stroke:var(--red);stroke-width:2;stroke-linecap:round;stroke-dasharray:400;stroke-dashoffset:400;animation:draw .9s .4s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.mini-rep{margin-top:14px;border-top:1px dashed var(--line-2);padding-top:12px;font-size:13.5px}
.mini-rep ul{margin:6px 0 0;padding-left:18px;color:var(--ink-2)}
.tutor-note{font-family:var(--f-note);font-style:italic;font-size:17px;line-height:1.4;color:var(--ink)}

section.block{padding:64px 0}
section.white{background:var(--sheet);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.sec-head{max-width:720px;margin:0 0 30px}
.sec-head.center{margin:0 auto 30px;text-align:center}
.sec-head h2{font-size:34px;margin:10px 0 10px}
.tabs{display:inline-flex;border:1px solid var(--ink);border-radius:var(--r);margin:0 0 24px;overflow:hidden}
.tabs button{border:0;background:none;padding:9px 18px;font-weight:600;font-size:14.5px;color:var(--ink-2)}
.tabs button + button{border-left:1px solid var(--ink)}
.tabs button.on{background:var(--ink);color:#fff}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-top:1.5px solid var(--ink)}
.steps .card{border:0;border-right:1px solid var(--line);border-radius:0;background:transparent;padding:18px 20px 6px 0;margin-right:20px}
.steps .card:last-child{border-right:0;margin-right:0}
.step-n{font-family:var(--f-mono);font-size:13px;color:var(--celeste-d);margin-bottom:10px;display:block}
.step-n::before{content:"0"}
.steps h4{margin-bottom:6px;font-size:17px}
.feat-grid{display:grid;grid-template-columns:repeat(4,1fr);border-top:1.5px solid var(--ink);border-left:1px solid var(--line)}
.feat{display:flex;flex-direction:column;border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);border-radius:0;padding:20px}
.feat h4{font-size:16.5px;margin:8px 0 6px}
.feat p{font-size:14px;color:var(--muted);flex:1}
.feat .num{font-family:var(--f-mono);color:var(--celeste-d);font-size:12.5px}
.feat button{align-self:flex-start;margin-top:14px;background:none;border:0;padding:0;color:var(--azul);font-weight:600;font-size:14px;text-decoration:underline;text-underline-offset:4px}
.trust-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-top:1.5px solid var(--ink)}
.trust-grid .card{border:0;border-right:1px solid var(--line);border-radius:0;background:transparent;padding:20px 20px 4px 0;margin-right:20px}
.trust-grid .card:last-child{border:0;margin:0}
.trust-ic{color:var(--azul);margin-bottom:10px;display:block}
.price-grid{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--ink);border-radius:var(--r);background:var(--sheet)}
.price{border:0;border-right:1px solid var(--line);border-radius:0;text-align:left}
.price:last-child{border-right:0}
.price .muted{font-family:var(--f-mono);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.price b{display:block;font-family:var(--f-mono);font-size:32px;font-weight:500;letter-spacing:-.02em;margin:10px 0 4px;color:var(--ink)}
.price.hot{background:var(--azul-t);box-shadow:none}
.guarantee{display:flex;gap:16px;align-items:center;margin-top:18px;border-left:3px solid var(--ok);background:var(--ok-t);padding:14px 18px;color:#123F2A}
.guarantee .trust-ic{margin:0;color:var(--ok)}
.guarantee b{font-size:16px}
.devices{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center}
.dev-row{display:flex;gap:16px;align-items:flex-end;justify-content:center}
.dev{background:var(--ink);border-radius:10px;padding:7px}
.dev .scr{background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:12px 12px;border-radius:5px;display:grid;place-items:center;color:var(--azul);font-family:var(--f-mono);font-size:13px;text-align:center}
.testi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
.testi{border:0;border-top:1.5px solid var(--ink);border-radius:0;background:transparent;padding:16px 0 0}
.testi p{font-family:var(--f-note);font-style:italic;font-size:19px;line-height:1.4;color:var(--ink);margin:10px 0 14px}
.faq-grid{display:grid;grid-template-columns:1fr 1fr;gap:32px}
details{border:0;border-top:1px solid var(--line-2);padding:14px 0;margin:0}
details:last-child{border-bottom:1px solid var(--line-2)}
summary{font-weight:600;cursor:pointer;font-size:15.5px;list-style:none;display:flex;justify-content:space-between;gap:12px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-family:var(--f-mono);color:var(--azul);font-size:18px;line-height:1}
details[open] summary::after{content:"−"}
details p{margin-top:8px;color:var(--ink-2);font-size:14.5px;max-width:60ch}
.final-cta{border:1.5px solid var(--ink);border-radius:var(--r);padding:36px;background-color:var(--sheet)}
.final-cta h2{font-size:30px;margin-bottom:20px}
.final-cta .role-ctas{max-width:none}
footer{border-top:1px solid var(--line);padding:24px 0 44px;color:var(--muted);font-size:13.5px}
footer .link{font-size:13.5px;padding:4px 8px}
.check-list{list-style:none;padding:0;margin:16px 0 0}
.check-list li{padding:9px 0 9px 26px;position:relative;color:var(--ink-2);border-top:1px solid var(--line)}
.check-list li::before{content:"";position:absolute;left:3px;top:15px;width:10px;height:5px;border-left:1.6px solid var(--ok);border-bottom:1.6px solid var(--ok);transform:rotate(-45deg)}

/* páginas */
.page{padding:32px 20px 64px}
.page.narrow{max-width:780px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap;padding-bottom:16px;border-bottom:1.5px solid var(--ink)}
.page-head h2{font-size:32px}
.grid-2-1{display:grid;grid-template-columns:1.6fr 1fr;gap:20px;align-items:start}
.center-page{display:grid;place-items:center;min-height:calc(100vh - 160px)}

/* asistente */
.wiz-steps{display:flex;gap:0;margin:0 0 20px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.ws{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:500;color:var(--muted);padding:8px 14px 10px 0;margin-right:14px;border-bottom:2px solid transparent;margin-bottom:-1px}
.ws span{font-family:var(--f-mono);font-size:12px}
.ws.on{color:var(--ink);border-bottom-color:var(--azul);font-weight:700}
.ws.on span{color:var(--azul)}
.ws.done{color:var(--ok)}
.who-grid{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--ink);border-radius:var(--r);background:var(--sheet)}
.who{background:transparent;border:0;padding:24px;text-align:left;display:flex;flex-direction:column;gap:8px}
.who + .who{border-left:1px solid var(--ink)}
.who:hover{background:var(--azul-t)}
.who .ic{color:var(--azul)}
.who b{font-size:19px;font-stretch:110%;letter-spacing:-.015em}
.wiz-foot{display:flex;justify-content:space-between;gap:12px;margin-top:24px;padding-top:16px;border-top:1px solid var(--line)}
.cred{border:1px dashed var(--line-2);border-radius:var(--r);padding:14px 16px;font-size:14.5px;margin:16px 0}
.cred code{font-family:var(--f-mono);border-bottom:1.5px solid var(--amber);padding:0 2px;font-weight:500}
.big-ok,.big-wait{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;margin:0 auto 14px}
.big-ok{border:1.5px solid var(--ok);color:var(--ok)}
.big-wait{border:1.5px solid #8A5A00;color:#8A5A00}
.file-row{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding:12px 0}
.file-row input{font-size:13px;max-width:230px}
.subj-row{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);padding:10px 0}
.subj-row label{flex:1;display:flex;align-items:center;gap:10px;font-weight:600}
.subj-row input[type=checkbox]{width:18px;height:18px;accent-color:var(--azul)}
.subj-row input[type=number]{width:110px}
.quiz{border:0;border-top:1px solid var(--line);padding:16px 0}
.quiz:first-of-type{border-top:0}
.quiz > b,.quiz .row b{font-size:15.5px}
.quiz .opts{display:grid;gap:6px;margin-top:10px}
.quiz label{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:var(--r);padding:9px 12px;font-size:15px;cursor:pointer;background:var(--sheet)}
.quiz label:hover{border-color:var(--line-2)}
.quiz label:has(input:checked){border-color:var(--azul);background:var(--azul-t)}
.quiz input[type=radio],.quiz input[type=checkbox]{accent-color:var(--azul)}
.coc{border-left:3px solid var(--ink);padding:4px 16px;font-size:14px;color:var(--ink-2);margin:0 0 14px}
.coc ul{margin:6px 0 0;padding-left:18px}
.timeline{list-style:none;padding:0;margin:18px 0}
.timeline li{display:flex;gap:12px;padding:10px 0;align-items:flex-start;border-top:1px solid var(--line)}
.timeline .d{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;flex:none;border:1.5px solid}
.timeline .d.ok{color:var(--ok)}
.timeline .d.wait{color:#8A5A00;border-style:dashed}
.timeline .d.no{color:var(--muted);border-color:var(--line-2)}

/* estudiante */
.online-pill{display:flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:12.5px;color:var(--ink-2)}
.dot{width:8px;height:8px;border-radius:50%;background:#1E9E5A;box-shadow:0 0 0 3px rgba(30,158,90,.18)}
.subj-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-bottom:22px;border:1px solid var(--line-2);border-radius:var(--r)}
.subj{border:0;background:var(--sheet);padding:14px;font-weight:600;display:flex;flex-direction:column;align-items:flex-start;gap:10px;text-align:left;position:relative}
.subj + .subj{border-left:1px solid var(--line-2)}
.subj-ic{font-family:var(--f-mono);font-size:15px;font-weight:500;color:var(--c);min-width:38px;height:30px;display:flex;align-items:center;border-bottom:1.5px solid var(--c)}
.subj.on{background:var(--azul-t);box-shadow:inset 0 -3px 0 var(--c)}
.dur-grid{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line-2);border-radius:var(--r)}
.dur{border:0;background:var(--sheet);padding:12px 14px;display:flex;flex-direction:column;gap:2px;text-align:left}
.dur + .dur{border-left:1px solid var(--line-2)}
.dur b{font-family:var(--f-mono);font-size:18px;font-weight:500}
.dur span{font-size:13px;color:var(--muted)}
.dur.on{background:var(--azul);color:#fff}
.dur.on span{color:#DCE5F5}
.dur:disabled{opacity:.45}
.photo-drop{display:flex;align-items:center;gap:12px;border:1px dashed var(--line-2);border-radius:var(--r);padding:12px;margin-top:12px;font-size:14px;cursor:pointer;background:var(--sheet)}
.photo-drop:hover{border-color:var(--azul)}
.photo-drop img{width:64px;height:64px;object-fit:cover;border-radius:2px}
.photo-drop .ic{color:var(--azul)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.kv span{color:var(--muted)}
.kv b{text-align:right;font-weight:600}
.kv.total{border:0;font-size:17px;margin:6px 0 14px}
.kv.total b{font-family:var(--f-mono);font-weight:500;font-size:22px}
.locked{position:relative}
.locked::after{content:"";position:absolute;inset:0;background:rgba(247,245,240,.65)}
.av{width:40px;height:40px;border-radius:50%;color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px;flex:none;font-family:var(--f-mono)}
.av.lg{width:68px;height:68px;font-size:21px}
.av.sm{width:32px;height:32px;font-size:12px}
.verified{display:inline-flex;align-items:center;gap:5px;color:var(--ok);font-family:var(--f-mono);font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.05em;padding:2px 7px;border:1.5px solid var(--ok);border-radius:3px;vertical-align:middle;margin-left:8px;white-space:nowrap;transform:rotate(-2deg)}
.vbadges{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px}
.vbadge{font-family:var(--f-mono);font-size:12px;color:var(--ink-2);padding-left:12px;position:relative}
.vbadge::before{content:"";position:absolute;left:0;top:5px;width:6px;height:6px;background:var(--celeste)}
.stars{color:#D29A12;letter-spacing:1px}
.stars .off{color:#D9D3C4}
.rating{display:flex;align-items:center;gap:6px;font-size:14px;margin-top:4px}
.rating b{font-family:var(--f-mono);font-weight:500}
.rep-row{margin:10px 0}
.rep-row .row{justify-content:space-between;font-size:14px;font-weight:600}
.bar{height:6px;background:rgba(14,31,61,.08);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--azul)}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}
.medal{text-align:center;padding:8px 2px}
.medal .m{width:58px;height:58px;border-radius:50%;margin:0 auto 8px;display:grid;place-items:center;border:1.5px solid;transform:rotate(-4deg);position:relative}
.medal .m::after{content:"";position:absolute;inset:3px;border-radius:50%;border:1px dashed currentColor;opacity:.55}
.medal.oro .m{color:#A06A00}
.medal.plata .m{color:#56627A}
.medal.bronce .m{color:#9A4A1A}
.medal.none .m{color:#B7BDC8;border-style:dashed}
.medal.none .m::after{display:none}
.medal b{display:block;font-size:13.5px}
.medal span{font-family:var(--f-mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}

.match-card{text-align:center;max-width:470px;width:100%;padding:36px 28px}
.radar{position:relative;width:170px;height:170px;margin:0 auto;border:1px solid var(--line-2);border-radius:50%;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:17px 17px}
.radar span{position:absolute;inset:-1px;border-radius:50%;border:1.5px solid var(--azul);opacity:0;animation:ping 2.4s infinite ease-out}
.radar span:nth-child(2){animation-delay:.8s}.radar span:nth-child(3){animation-delay:1.6s}
.radar-core{position:absolute;inset:55px;border-radius:50%;background:var(--azul);color:#fff;display:grid;place-items:center;font-family:var(--f-mono);font-size:17px}
@keyframes ping{0%{transform:scale(.35);opacity:.9}100%{transform:scale(1);opacity:0}}
.big-timer{font-family:var(--f-mono);font-size:52px;font-weight:500;letter-spacing:-.03em;margin:14px 0 2px;font-variant-numeric:tabular-nums}
.notified{display:flex;justify-content:center;margin:12px 0}
.notified .av{width:34px;height:34px;font-size:11px;margin-left:-8px;border:2px solid var(--sheet);opacity:.3;transition:opacity .3s}
.notified .av.lit{opacity:1}
.success-banner{border-left:3px solid var(--ok);background:var(--ok-t);color:#123F2A;padding:12px 16px;font-weight:500;margin-bottom:16px}
.success-banner b{font-family:var(--f-mono)}
.verif-list{display:grid;grid-template-columns:1fr 1fr;gap:0 20px;margin:18px 0;padding:6px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-size:14px}
.verif-list div{padding:7px 0 7px 22px;position:relative}
.verif-list div::before{content:"";position:absolute;left:3px;top:13px;width:9px;height:5px;border-left:1.6px solid var(--ok);border-bottom:1.6px solid var(--ok);transform:rotate(-45deg)}
.review{border-top:1px solid var(--line);padding:10px 0;font-size:14.5px}
.review .rv-who{font-weight:600;font-size:13.5px}
.escrow{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin:16px 0;border-top:1.5px solid var(--ink)}
.escrow div{padding:12px 14px 4px 0;font-size:13.5px;color:var(--ink-2)}
.escrow div + div{padding-left:14px;border-left:1px solid var(--line)}
.escrow b{display:block;font-size:14px;margin-bottom:2px;color:var(--ink)}

/* sesión en vivo · modo pizarra */
.pizarra{background:#0F1E33;color:#EAF2F8;min-height:calc(100vh - 62px)}
.pizarra .card{background:#15283F;border-color:rgba(234,242,248,.12);color:#EAF2F8}
.pizarra .muted,.pizarra .tiny.muted{color:#9FB2C8}
.pizarra .btn.ghost{border-color:#EAF2F8;color:#EAF2F8;background:transparent}
.pizarra .btn.danger{border-color:#FF7A59;color:#FF7A59}
.pizarra .btn.primary{background:#F5D45C;color:#0F1E33}
.pizarra input[type=text]{border-bottom-color:#EAF2F8;color:#EAF2F8}
.pizarra input::placeholder{color:#7F93AB}
.session-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px;padding:14px 18px}
.rec{display:inline-flex;align-items:center;gap:7px;font-family:var(--f-mono);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:#FF9C80}
.rec::before{content:"";width:8px;height:8px;border-radius:50%;background:#FF5A3C;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}
.s-timer{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:500;font-size:20px;margin-left:auto}
.session-grid{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;align-items:start}
.board-card{padding:0;overflow:hidden}
.board-tools{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid rgba(234,242,248,.12);flex-wrap:wrap}
.swatch{width:24px;height:24px;border-radius:50%;border:2px solid #15283F;box-shadow:0 0 0 1px rgba(234,242,248,.3)}
.swatch.on{box-shadow:0 0 0 2px #EAF2F8}
.tool{border:1px solid rgba(234,242,248,.3);background:transparent;color:#EAF2F8;border-radius:var(--r);padding:5px 10px;font-size:13px;font-weight:500}
.tool.on{background:#EAF2F8;color:#0F1E33}
#board{display:block;width:100%;height:470px;touch-action:none;cursor:crosshair;background-color:#132A44;background-image:linear-gradient(rgba(92,205,240,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(92,205,240,.09) 1px,transparent 1px);background-size:24px 24px}
.videos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vid{aspect-ratio:4/3;border-radius:var(--r);background:#0A1626;border:1px solid rgba(234,242,248,.12);position:relative;display:grid;place-items:center;overflow:hidden}
.vid .av{width:56px;height:56px;font-size:17px}
.vid.talk .av{animation:talk 1.4s infinite}
@keyframes talk{50%{box-shadow:0 0 0 8px rgba(92,205,240,.25)}}
.vid span{position:absolute;left:8px;bottom:8px;color:#EAF2F8;font-family:var(--f-mono);font-size:11.5px;background:rgba(0,0,0,.45);padding:2px 7px}
.chat{padding:0;display:flex;flex-direction:column;height:340px}
.chat-box{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:85%;padding:9px 12px;border-radius:var(--r);font-size:14.5px}
.msg img{display:block;max-width:180px;border-radius:2px;margin-top:6px}
.msg.o{background:#1F3655}
.msg.me{background:#2D5DB5;color:#fff;margin-left:auto}
.msg.sys{align-self:center;background:none;color:#8FA4BD;font-family:var(--f-mono);font-size:11.5px;padding:2px}
.chat-form{display:flex;gap:8px;padding:10px 14px;border-top:1px solid rgba(234,242,248,.12);align-items:center}
.chat-form input{flex:1}
.star-pick{display:flex;gap:6px;justify-content:center;margin:18px 0}
.star-pick button{background:none;border:0;font-size:38px;line-height:1;color:#D9D3C4;padding:0 2px;transition:transform .1s}
.star-pick button.on{color:#D29A12}
.star-pick button:hover{transform:scale(1.1)}
.spinner{width:40px;height:40px;border-radius:50%;border:3px solid var(--azul-t);border-top-color:var(--azul);animation:spin .9s linear infinite;margin:0 auto 14px}
@keyframes spin{to{transform:rotate(360deg)}}

/* reporte · boletín */
.report{border:1px solid var(--line-2);border-top:4px solid var(--c,var(--azul));border-radius:var(--r);background:var(--sheet)}
.report-head{padding:16px 20px 12px;color:var(--ink);background:none;border-bottom:1px solid var(--line)}
.report-head .tiny{font-family:var(--f-mono);font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);opacity:1!important}
.report-head h3{margin:6px 0 0;font-size:21px;font-stretch:110%;letter-spacing:-.015em}
.report-body{padding:16px 20px;font-size:14.5px}
.report-body h4{font-family:var(--f-mono);font-size:11.5px;font-weight:500;text-transform:uppercase;letter-spacing:.07em;color:var(--celeste-d);margin:16px 0 6px}
.report-body ul{margin:0;padding-left:18px}
.report-body > p{font-family:var(--f-note);font-style:italic;font-size:17px;line-height:1.4;border-left:2px solid var(--amber);padding-left:12px}
.eval-row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--line)}
.sent{margin-top:16px;font-size:13px;color:var(--ok);font-weight:600;display:flex;align-items:center;gap:8px}
.sent::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok)}

/* panel padre / tutor */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);margin-bottom:22px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--sheet)}
.kpi{padding:16px 18px}
.kpi + .kpi{border-left:1px solid var(--line)}
.kpi span{font-family:var(--f-mono);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.kpi b{display:block;font-family:var(--f-mono);font-size:28px;font-weight:500;letter-spacing:-.02em;margin-top:4px}
.kid{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.rep-item{display:flex;align-items:center;gap:14px;padding:12px 4px;border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;width:100%;text-align:left}
.rep-item:hover{background:var(--azul-t)}
.rep-item .ic{color:var(--c,var(--azul))}
.rep-item .sic{font-family:var(--f-mono);font-size:13px;width:44px;flex:none;color:var(--c);border-bottom:1.5px solid var(--c);padding-bottom:2px}
.rep-item .grow{flex:1;min-width:0}
.rep-item .t{font-weight:600;font-size:14.5px}
.rep-item .s{font-size:13px;color:var(--muted)}
.new-dot{font-family:var(--f-mono);font-size:10.5px;font-weight:500;text-transform:uppercase;letter-spacing:.05em;color:var(--red);border:1.5px solid var(--red);padding:1px 6px;border-radius:3px;margin-left:6px;display:inline-block;transform:rotate(-3deg)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-family:var(--f-mono);font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:8px 6px;border-bottom:1.5px solid var(--ink)}
td{padding:10px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
td:nth-child(3){font-family:var(--f-mono)}
.st{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:500;white-space:nowrap;color:var(--ink-2)}
.st::before{content:"";width:7px;height:7px;border-radius:50%;flex:none}
.st.retenido::before{background:var(--azul)}
.st.revision::before{background:var(--amber);box-shadow:0 0 0 1.5px #8A5A00}
.st.liberado::before{background:var(--ok)}
.st.reembolsado::before{background:var(--red)}
.st.gratis::before{background:transparent;border:1.5px solid var(--muted)}
.hbar{margin:12px 0}
.hbar .row{justify-content:space-between;font-size:14px;font-weight:500}
.hbar .row span:last-child{font-family:var(--f-mono)}
.hbar .bar{height:6px}
.hbar .bar i{background:var(--c)}
.banner{display:flex;align-items:center;justify-content:space-between;gap:14px;border:1px solid var(--azul);border-left:4px solid var(--azul);background:var(--azul-t);color:var(--ink);border-radius:var(--r);padding:14px 18px;margin-bottom:22px;flex-wrap:wrap}
.banner.amber{border-color:#8A5A00;background:#FBF3DE}
.toggle-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;font-size:14.5px;border-bottom:1px solid var(--line)}
.mini-switch{width:40px;height:22px;border-radius:99px;background:#C9CFD9;position:relative;border:0;padding:0}
.mini-switch::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}
.mini-switch.on{background:var(--azul)}
.mini-switch.on::after{left:21px}
.switch{display:inline-flex;align-items:center;gap:10px;background:var(--sheet);border:1.5px solid var(--ink);border-radius:var(--r);padding:6px 14px 6px 8px;font-weight:600;font-size:14.5px}
.switch .knob{width:44px;height:24px;border-radius:99px;background:#C9CFD9;position:relative;transition:.2s}
.switch .knob::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}
.switch.on .knob{background:#1E9E5A}
.switch.on .knob::after{left:23px}
.req{border:1.5px solid var(--azul);border-radius:var(--r);padding:16px 18px;background:var(--azul-t)}
.req-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin:12px 0;font-size:14.5px}
.req-grid span{color:var(--muted)}
.empty{text-align:center;padding:30px 10px;color:var(--muted)}
.mini-radar{width:60px;height:60px;position:relative;margin:0 auto 12px;border-radius:50%;border:1px solid var(--line-2)}
.mini-radar span{position:absolute;inset:-1px;border-radius:50%;border:1.5px solid var(--azul);animation:ping 2s infinite;opacity:0}
.mini-radar span:nth-child(2){animation-delay:1s}
.calc{background:var(--sheet);border:1.5px solid var(--ink);border-radius:var(--r);padding:24px}
.calc input[type=range]{width:100%;accent-color:var(--azul);border:0}
.calc .big{font-family:var(--f-mono);font-size:44px;font-weight:500;letter-spacing:-.03em;color:var(--azul)}

/* diagnóstico */
.dx-grid{display:grid;grid-template-columns:1.5fr 1fr;gap:20px;align-items:start;margin-bottom:20px}
.dx-subjs{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-top:14px;border-top:1.5px solid var(--ink)}
.dx-subj{border:0;border-top:3px solid var(--c);margin-top:-1.5px;padding:14px 16px 4px 0;display:flex;flex-direction:column;gap:2px;background:transparent}
.dx-subj + .dx-subj{padding-left:16px;border-left:1px solid var(--line)}
.dx-subj .btn{margin-top:auto}
.dx-subj .bar i{background:var(--c)!important}
.dx-lbl{font-family:var(--f-mono);font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:14px 0 8px}
.dx-rec{font-size:14px;color:var(--ink-2);margin:12px 0 14px}
.gapchip{font-size:14px;font-weight:600;color:var(--red);padding:3px 10px;border:1.5px solid var(--red);border-radius:50% / 60%;transform:rotate(-2deg);display:inline-block;margin:2px 4px 2px 0}
.gapchip i{font-weight:400;font-style:normal;font-size:12px;opacity:.8}
.lvl{font-family:var(--f-mono);font-size:10.5px;font-weight:500;text-transform:uppercase;letter-spacing:.05em;padding:2px 7px;border:1.5px solid;border-radius:3px;white-space:nowrap;display:inline-block;transform:rotate(-2deg)}
.lvl.ok{color:var(--ok)}.lvl.amber{color:#8A5A00}.lvl.bad{color:var(--red)}
.tip{border:0;border-top:1px solid var(--line);padding:12px 0 12px 34px;margin:0;position:relative;counter-increment:tip}
.tip::before{content:counter(tip,decimal-leading-zero);position:absolute;left:0;top:13px;font-family:var(--f-mono);font-size:12.5px;color:var(--celeste-d)}
.card:has(.tip){counter-reset:tip}
.tip p{font-size:14px;color:var(--ink-2);margin-top:3px}
.plan-row{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.plan-row:last-child{border:0}
.plan-row span{font-family:var(--f-mono);font-size:12.5px;text-transform:uppercase;letter-spacing:.04em;width:88px;flex:none;color:var(--azul);padding-top:1px}
.dx-parts{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin:20px 0;border-top:1.5px solid var(--ink)}
.dx-parts > div{padding:14px 16px 6px 0}
.dx-parts > div + div{padding-left:16px;border-left:1px solid var(--line)}
.dx-parts .step-n{margin-bottom:6px}
.dx-strip{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:22px;border-left:4px solid var(--azul)}
.dx-strip > .ic{color:var(--azul)}
.dx-strip .grow{flex:1;min-width:220px}
.chip.gap-topic{border-style:dashed;border-color:var(--red)}
.chip.gap-topic::after{content:"por reforzar";font-family:var(--f-mono);font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--red)}
.chip.gap-topic.on::after{color:#FFD8CB}
.dx-hero{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center}
.dx-modal .dx-grid{grid-template-columns:1fr}

/* avisos, modal, simulador, recorrido */
#toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:80}
body.touring #toasts{bottom:150px}
.toast{background:var(--ink);color:#fff;padding:12px 16px;border-radius:var(--r);font-size:14px;font-weight:500;max-width:340px;animation:in .2s ease-out;border-left:3px solid #4ADE80}
.toast.info{border-left-color:var(--celeste)}
.toast.out{opacity:0;transform:translateY(6px);transition:.3s}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.modal{position:fixed;inset:0;background:rgba(14,31,61,.5);display:grid;place-items:center;z-index:50;padding:16px}
.modal.hidden{display:none}
.modal-card{background:var(--paper);border:1px solid var(--ink);border-radius:6px;max-width:560px;width:100%;max-height:88vh;overflow:auto;padding:24px}
#sim{position:fixed;left:16px;bottom:16px;z-index:70}
.sim-btn{background:var(--ink);color:#fff;border:0;border-radius:var(--r);padding:9px 14px;font-family:var(--f-mono);font-size:12px;text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:center;gap:8px}
.sim-panel{background:var(--paper);border:1px solid var(--ink);border-radius:var(--r);width:300px;padding:16px;margin-bottom:10px}
.sim-panel h4{font-family:var(--f-mono);font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:14px 0 6px}
.sim-panel .btn{width:100%;justify-content:flex-start;margin-bottom:6px}
#tour{position:fixed;left:0;right:0;bottom:0;z-index:75;background:var(--ink);color:#fff}
#tour.hidden{display:none}
.tour-in{max-width:1180px;margin:0 auto;padding:16px 20px;display:flex;gap:18px;align-items:center}
.tour-n{font-family:var(--f-mono);font-size:12.5px;color:#9FB2C8;white-space:nowrap}
.tour-tag{display:inline-block;font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--amber);margin-right:10px}
.tour-txt{flex:1}
.tour-txt b{font-size:16.5px}
.tour-txt p{color:#C6D3E3;font-size:14px;margin-top:3px}
.tour-prog{height:3px;background:#24395A}
.tour-prog i{display:block;height:100%;background:var(--celeste);transition:width .3s}
.tour-ctrl{display:flex;gap:8px}
.tour-ctrl button{background:transparent;border:1px solid #3B5277;color:#fff;border-radius:var(--r);padding:8px 12px;font-weight:600;font-size:13.5px}
.tour-ctrl button.main{background:var(--amber);border-color:var(--amber);color:var(--ink)}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.annot path{stroke-dashoffset:0}}
@media (max-width:920px){
  .hero-grid,.grid-2-1,.session-grid,.devices,.faq-grid,.dx-grid,.dx-hero{grid-template-columns:1fr}
  .phone{margin:24px auto 0}
  .steps,.feat-grid,.price-grid,.kpis,.trust-grid,.testi-grid{grid-template-columns:1fr 1fr}
  .kpi:nth-child(3){border-left:0}
  .kpi:nth-child(n+3){border-top:1px solid var(--line)}
  .price:nth-child(2){border-right:0}
  .price:nth-child(n+3){border-top:1px solid var(--line)}
  .steps .card:nth-child(2){border-right:0;margin-right:0}
  .hero h1{font-size:38px}
  .pubnav{display:none}
  .top .wrap > .row{margin-left:auto}
  .tour-in{flex-wrap:wrap}
  .dx-subjs{grid-template-columns:1fr}
  .dx-subj + .dx-subj{padding-left:0;border-left:0}
}
@media (max-width:620px){
  .role-ctas,.who-grid,.fgrid,.verif-list,.escrow,.req-grid,.dx-parts{grid-template-columns:1fr}
  .role-cta + .role-cta,.who + .who{border-left:0;border-top:1px solid var(--ink)}
  .escrow div + div,.dx-parts > div + div{padding-left:0;border-left:0;border-top:1px solid var(--line)}
  .dur-grid{grid-template-columns:1fr 1fr}
  .dur:nth-child(3){border-left:0}
  .dur:nth-child(n+3){border-top:1px solid var(--line-2)}
  .steps,.feat-grid,.price-grid,.trust-grid,.testi-grid{grid-template-columns:1fr}
  .steps .card,.trust-grid .card{border-right:0;margin-right:0;border-bottom:1px solid var(--line)}
  .price{border-right:0;border-top:1px solid var(--line)}
  #board{height:340px}
  .role-pill,.top .link{display:none}
  .user-chip span{display:none}
  .sim-panel{width:calc(100vw - 32px)}
  .hero h1{font-size:34px}
  .page-head h2{font-size:26px}
  .kpi b{font-size:22px}
}
</style>

<script>
/* =========================================================

const $ = (s, r = document) => r.querySelector(s);

const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : 0;
const fmt = s => (s < 0 ? '-' : '') + Math.floor(Math.abs(s) / 60) + ':' + String(Math.floor(Math.abs(s) % 60)).padStart(2, '0');
const pick = a => a[Math.floor(Math.random() * a.length)];
const fdate = t => new Date(t).toLocaleDateString('es-EC', { day: 'numeric', month: 'short' });

const stars = (n, max = 5) => { let h = '<span class="stars">'; for (let i = 1; i <= max; i++) h += i <= Math.round(n) ? '★' : '<span class="off">★</span>'; return h + '</span>'; };
const first = n => String(n || '').split(' ')[0];
const initials = n => String(n || '?').split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join('');
const ageOf = b => { if (!b) return null; const d = new Date(b), n = new Date(); let a = n.getFullYear() - d.getFullYear(); if (n < new Date(n.getFullYear(), d.getMonth(), d.getDate())) a--; return a; };
const DAY = 86400000;
let ticks = [];
const every = (fn, ms) => ticks.push(setInterval(fn, ms));
const later = (fn, ms) => ticks.push(setTimeout(fn, ms));
const ICONS = {

  student: '<path d="M7 8a5 5 0 0 1 10 0v12H7z"/><path d="M10 3.5h4"/><path d="M7 13h10"/><path d="M10 13v3h4v-3"/>',

/* =========================================================

const SUBJECTS = {

  { id: 2, name: 'Kevin Mora', carrera: 'Ing. Química', sem: 7, grades: { qui: 9.4, mat: 8.7 }, rating: 4.8, count: 41, sessions: 97, color: '#8A4B1E', online: true,

  { id: 3, name: 'Daniela Ortiz', carrera: 'Ing. Mecánica', sem: 5, grades: { fis: 9.0, mat: 8.5 }, rating: 4.7, count: 33, sessions: 71, color: '#0077A8', online: true,

  { id: 5, name: 'Mélany Torres', carrera: 'Biotecnología', sem: 6, grades: { qui: 9.1 }, rating: 4.8, count: 19, sessions: 40, color: '#2E7D5B', online: true,

function handleRegForm() {
  const R = S.reg, d = R.d, v = id => ($('#' + id)?.value || '').trim(), errs = [];
  const isMail = x => /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(x), isPhone = x => x.replace(/\D/g, '').length >= 9;
  if (R.who === 'padre') {
    if (R.step === 1) {
      Object.assign(d, { pName: v('pName'), pEmail: v('pEmail'), pPhone: v('pPhone'), pPass: v('pPass') });
      if (!d.pName) errs.push('escribe tu nombre'); if (!isMail(d.pEmail)) errs.push('revisa el correo'); if (!isPhone(d.pPhone)) errs.push('revisa el celular'); if (d.pPass.length < 6) errs.push('la contraseña debe tener al menos 6 caracteres');
    } else if (R.step === 2) {
      Object.assign(d, { cName: v('cName'), cCurso: v('cCurso'), cBirth: v('cBirth'), cColegio: v('cColegio'), cSubj: $$('input[name=cSubj]:checked').map(x => x.value) });
      if (!d.cName) errs.push('escribe el nombre de tu hijo'); if (!d.cBirth) errs.push('indica su fecha de nacimiento');
    } else if (R.step === 3) {
      Object.assign(d, { kData: $('#kData').checked, kRec: $('#kRec').checked, kMail: $('#kMail').checked, kWa: $('#kWa').checked });
      if (!d.kData) errs.push('autoriza el tratamiento de datos'); if (!d.kRec) errs.push('autoriza la grabación de sesiones');
    } else if (R.step === 4) {
      d.method = $('input[name=method]:checked').value;
    }
    if (errs.length) return showErr(errs);
    if (R.step < 4) { R.step++; return render(); }
    S.parent = { name: d.pName, email: d.pEmail, phone: d.pPhone, pass: d.pPass, method: d.method, notify: { email: d.kMail, wa: d.kWa } };
    const parts = d.cName.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').split(/\s+/);
    S.child = { name: d.cName, user: parts[0] + (parts[1] ? '.' + parts[1] : ''), pass: 'Poli-' + Math.floor(1000 + Math.random() * 9000), curso: d.cCurso, colegio: d.cColegio, birth: d.cBirth,
      subjects: d.cSubj, status: 'activo', trialUsed: false, rep: { punt: [], resp: [], cons: [] } };
    S.reports = []; S.payments = []; resetFlow();
    R.step = 'done'; render(); toast('Cuenta familiar creada');
  } else {
    if (R.step === 1) {
      Object.assign(d, { sName: v('sName'), sCurso: v('sCurso'), sBirth: v('sBirth'), sEmail: v('sEmail'), sPass: v('sPass') });
      if (!d.sName) errs.push('escribe tu nombre'); if (!d.sBirth) errs.push('indica tu fecha de nacimiento'); if (!d.sEmail) errs.push('escribe tu correo o usuario'); if (d.sPass.length < 6) errs.push('la contraseña debe tener al menos 6 caracteres');
    } else {
      Object.assign(d, { rName: v('rName'), rEmail: v('rEmail'), rPhone: v('rPhone') });
      if (!d.rName) errs.push('escribe el nombre de tu representante'); if (!isMail(d.rEmail)) errs.push('revisa el correo del representante'); if (!isPhone(d.rPhone)) errs.push('revisa el celular del representante');
    }
    if (errs.length) return showErr(errs);
    if (R.step === 1) { R.step = 2; return render(); }
    S.child = { name: d.sName, user: d.sEmail, pass: d.sPass, curso: d.sCurso, colegio: '', birth: d.sBirth, subjects: [], status: 'pendiente', trialUsed: false, rep: { punt: [], resp: [], cons: [] } };
    S.parent = { name: d.rName, email: d.rEmail, phone: d.rPhone, pending: true, notify: { email: true, wa: true } };
    S.reports = []; S.payments = []; resetFlow();
    R.step = 'done'; render(); toast('Invitación enviada a tu representante');
  }
}

      <h3 style="margin-top:18px">¿Dónde recibes tus pagos?</h3><div class="fgrid">${sel('Banco', 'tBank', BANKS, d.bank)}${sel('Tipo de cuenta', 'tType', ['Ahorros', 'Corriente'], d.type)}</div>
      <p class="hint">El número de cuenta se pide después de la aprobación.</p>`;

};
function handleTregForm() {
  const T = S.treg, d = T.d, v = id => ($('#' + id)?.value || '').trim(), errs = [];
  if (T.step === 1) {
    Object.assign(d, { tName: v('tName'), tEmail: v('tEmail').toLowerCase(), tPhone: v('tPhone'), tPass: v('tPass') });
    if (!d.tName) errs.push('escribe tu nombre'); if (!/^[^@\s]+@espol\.edu\.ec$/.test(d.tEmail)) errs.push('usa tu correo @espol.edu.ec');
    if (d.tPhone.replace(/\D/g, '').length < 9) errs.push('revisa el celular'); if (d.tPass.length < 6) errs.push('la contraseña debe tener al menos 6 caracteres');
  } else if (T.step === 2) {
    d.files = d.files || {};
    ['fCedF', 'fCedB', 'fSelf', 'fMat', 'fRec'].forEach(id => { const f = $('#' + id).files[0]; if (f) d.files[id] = f.name; });
    const lab = { fCedF: 'cédula (frente)', fCedB: 'cédula (reverso)', fSelf: 'selfie', fMat: 'matrícula vigente', fRec: 'récord académico' };
    Object.keys(lab).forEach(id => { if (!d.files[id]) errs.push('sube ' + lab[id]); });
  } else if (T.step === 3) {
    d.subj = {};
    $$('input[name=tS]:checked').forEach(x => { d.subj[x.value] = parseFloat(v('g_' + x.value)); });
    const ks = Object.keys(d.subj);
    if (!ks.length) errs.push('elige al menos una materia');
    ks.forEach(k => { if (isNaN(d.subj[k])) errs.push('ingresa tu nota en ' + SUBJECTS[k].name); else if (d.subj[k] < 8) errs.push(`necesitas 8/10 en ${SUBJECTS[k].name} (tienes ${d.subj[k]})`); });
  } else if (T.step === 4) {
    d.quiz = {};
    Object.keys(d.subj).forEach(k => { const c = $(`input[name=q_${k}]:checked`); d.quiz[k] = c ? +c.value : null; if (d.quiz[k] === null) errs.push('responde ' + SUBJECTS[k].name); else if (d.quiz[k] !== QUIZ[k].a) errs.push(`revisa tu respuesta de ${SUBJECTS[k].name}`); });
  } else {
    d.coc = $('#tCoc').checked; d.bank = v('tBank'); d.type = v('tType');
    if (!d.coc) errs.push('acepta el código de conducta');
  }
  if (errs.length) return showErr(errs);
  if (T.step < 5) { T.step++; return render(); }
  S.tutor = makeTutor({ name: d.tName, email: d.tEmail, phone: d.tPhone, pass: d.tPass, grades: { ...d.subj }, bank: d.bank, status: 'revision' });
  S.user = 'tutor'; S.treg = { step: 1, d: { subj: {} } };
  go('tutor'); toast('Solicitud enviada a verificación');

    subj[k] = { score, ok, n: qs.length, grade: isNaN(g) ? null : g, conf: s[k].conf, gaps, wrong, level: score >= 75 ? 'fuerte' : score >= 50 ? 'desarrollo' : 'refuerzo' };

  const tips = Object.entries(dims).filter(([, v]) => v < 60).sort((a, b) => a[1] - b[1]).map(([k]) => ({ dim: k, t: METHOD_TIPS[k][0], d: METHOD_TIPS[k][1] }));

  const pref = dxOpt('m10').o[m.m10][0];
  const order = Object.keys(subj).sort((a, b) => subj[a].score - subj[b].score);

  ];

}

  const end = () => { if (drawing) { drawing = false; save(); } };
  c.onpointerup = end; c.onpointercancel = end;
}

AFTER.tutor = () => {
  const T = S.tutor;
  if (!T || T.status !== 'verificado') return;
  if (T.view === 'session') return setupLive();
  if (T.view !== 'panel') return;
  if (T.online && !T.pending) later(() => {
    const pool = REQS.filter(r => T.grades[r.subj] !== undefined);
    T.pending = { ...pick(pool.length ? pool : REQS), left: 30 }; render(); toast('Nueva solicitud de tutoría', 'info');
  }, 3500);
  if (T.pending) every(() => {
    T.pending.left--; const el = $('#reqT'); if (el) el.textContent = T.pending.left;
    if (T.pending.left <= 0) { T.pending = null; render(); toast('La solicitud expiró y pasó a otro tutor', 'info'); }
  }, 1000);
};

    <div class="card" style="margin-top:12px;padding:14px;box-shadow:none"><div class="row between wrapf gap"><b style="font-size:14px">Califica al tutor como representante</b><span class="star-pick" style="margin:0">${[1, 2, 3, 4, 5].map(n => `<button style="font-size:26px" class="${n <= (r.pStars || 0) ? 'on' : ''}" data-act="pStar" data-id="${r.id}" data-n="${n}">★</button>`).join('')}</span></div></div>
    <div class="row gap end wrapf" style="margin-top:14px">${S.payments.find(p => p.id === r.payId && p.status === 'revision') ? `<button class="btn danger" data-act="claim" data-id="${r.payId}">Reportar un problema</button>` : ''}<button class="btn ghost" data-act="copyReport" data-id="${r.id}">Copiar</button><button class="btn primary" data-act="closeModal">Cerrar</button></div>`);
}
function claimModal(id) {
  const p = S.payments.find(x => x.id === id);
  return `<h3 style="font-size:19px">Reportar un problema</h3><p class="muted tiny" style="margin:4px 0 14px">El pago de ${money(p.amount)} sigue protegido. Revisaremos la grabación de la sesión.</p>
    <label class="lbl">¿Qué pasó?</label><select id="cReason"><option>El tutor no se presentó</option><option>La sesión no resolvió la duda</option><option>Problemas técnicos</option><option>Comportamiento inapropiado</option><option>Otro</option></select>
    <label class="lbl" style="margin-top:12px">Detalles (opcional)</label><textarea rows="3" placeholder="Cuéntanos más"></textarea>
    <div class="row gap end" style="margin-top:14px"><button class="btn ghost" data-act="closeModal">Cancelar</button><button class="btn danger" data-act="sendClaim" data-id="${id}">Enviar y pedir reembolso</button></div>`;
}

/* =========================================================
   Simulación guiada
   ========================================================= */
let tourTimer = null;
function prepForm() { ensureDemo(); S.user = 'student'; resetFlow(); Object.assign(S.flow, { subj: 'mat', topic: 'Derivadas', detail: 'No entiendo cuándo usar la regla de la cadena', dur: 1 }); }
function prepMatching() { prepForm(); confirmRequest(); }
function prepMatch() { prepMatching(); S.flow.matchStart = Date.now() - 42000; foundTutor(); }
function prepSession() { prepMatch(); startStudentLive(); }
function prepRate() { prepSession(); Object.assign(S.flow, { elapsed: 1712, step: 'rate', stars: 5, tags: ['Paciencia', 'Claridad'], comment: 'Me explicó la regla de la cadena con ejemplos.' }); }
function ensureRevision() { if (!S.payments.some(p => p.status === 'revision')) { prepRate(); finishStudentSession(); } }
const TOUR = [
  { id: 'home', tag: 'Homepage', t: 'Explica todo y separa los dos caminos', d: 'Arriba, dos entradas: “¿Eres padre o estudiante? Crea tu cuenta aquí” y “¿Eres estudiante ESPOL? Hazte tutor aquí”.', run: () => { S.user = null; go('inicio'); setTimeout(() => window.scrollTo(0, 0), 50); } },
  { id: 'quien', tag: 'Registro familiar', t: '¿Quién crea la cuenta?', d: 'El representante (recomendado) o el estudiante, que luego invita a su representante para que apruebe.', run: () => { S.user = null; S.reg = { who: null, step: 1, d: { cSubj: [] } }; go('registro-familia'); } },
  { id: 'hijo', tag: 'Registro familiar', t: 'El padre agrega a su hijo', d: 'El representante es el titular: paga y recibe reportes. Crea el perfil del hijo con su curso y materias.', run: () => { S.user = null; S.reg = { who: 'padre', step: 2, d: { pName: 'Ana Vera', pEmail: 'ana.vera@gmail.com', pPhone: '0991234567', pPass: 'demo123', cName: 'Mateo Vera', cCurso: CURSOS[1], cBirth: '2010-03-14', cSubj: ['mat', 'fis'] } }; go('registro-familia'); } },
  { id: 'permisos', tag: 'Seguridad', t: 'Consentimiento de datos y grabación', d: 'Antes de activar la cuenta, el representante autoriza el tratamiento de datos (LOPDP) y la grabación de sesiones.', run: () => { S.user = null; S.reg = { who: 'padre', step: 3, d: { pName: 'Ana Vera', cName: 'Mateo Vera', cBirth: '2010-03-14', cSubj: ['mat'], kData: true, kRec: true } }; go('registro-familia'); } },
  { id: 'diag', tag: 'Diagnóstico', t: 'Test de metodología y conocimientos', d: 'El estudiante responde cómo estudia, se autoevalúa por materia y hace una mini prueba de 7 ejercicios para detectar vacíos.', run: () => { ensureDemo(); S.user = 'student'; S.dx = { ...newDx(), step: 1, m: { m1: 1, m2: 0, m3: 0, m4: 1 } }; go('diagnostico'); } },
  { id: 'diag-res', tag: 'Diagnóstico', t: 'Qué le falta y cómo mejorar', d: 'Nivel por materia, temas por reforzar, perfil de metodología, técnicas de estudio y un plan semanal. El tutor y el padre también lo ven.', run: () => { ensureDemo(); S.user = 'student'; S.dx = null; S.child.diag = makeDiag(DEMO_DX); go('diagnostico'); } },
  { id: 'pedir', tag: 'Atributo 2', t: 'Pedir ayuda: materia, tema, foto y duración', d: 'El estudiante elige bloques de 30, 45 o 60 min (o la prueba gratis de 15). Puede subir una foto del ejercicio.', run: () => { prepForm(); go('estudiante'); } },
  { id: 'match1', tag: 'Atributo 1', t: 'Emparejamiento en menos de 3 minutos', d: 'Se notifica primero a los tutores mejor calificados en el tema. El primero que acepta toma la sesión.', ms: 8000, run: () => { prepMatching(); go('estudiante'); } },
  { id: 'tutor', tag: 'Atributos 3 y 7', t: 'Tutor verificado, con notas y reseñas', d: 'Insignias por materia, verificación visible, calificación promedio y número de reseñas.', run: () => { prepMatch(); go('estudiante'); } },
  { id: 'sesion', tag: 'Atributo 2', t: 'Sesión en vivo con pizarra y chat', d: 'Video, chat interno y pizarra compartida. Se graba por seguridad y se puede extender +15 min con aprobación del padre.', ms: 9000, run: () => { prepSession(); go('estudiante'); tourT(() => { pushChat({ from: 'me', text: '¿Por qué se multiplica por 6x?' }); autoReply(); }, 3800); } },
  { id: 'calif', tag: 'Atributo 7', t: 'Calificación obligatoria al cerrar', d: 'El estudiante califica de 1 a 5 y deja un comentario. El padre también puede calificar desde el reporte.', run: () => { prepRate(); go('estudiante'); } },
  { id: 'reporte', tag: 'Atributo 5', t: 'Reporte automático para el representante', d: 'Temas reforzados, próximos pasos y compromiso del estudiante, por correo y WhatsApp.', run: () => { ensureDemo(); prepRate(); finishStudentSession(); S.user = 'parent'; go('padre'); tourT(() => { const r = S.reports[0]; r.seen = true; openReportModal(r); }, 250); } },
  { id: 'pago', tag: 'Atributo 4', t: 'Pago protegido con ventana de reclamo', d: 'El pago queda retenido durante la sesión y se libera 24 h después. El padre puede reportar un problema y pedir reembolso.', run: () => { ensureDemo(); ensureRevision(); S.user = 'parent'; go('padre'); tourT(() => { closeModal(); $('#pagos')?.scrollIntoView({ behavior: 'smooth' }); }, 250); } },
  { id: 'verif', tag: 'Atributo 3', t: 'El tutor demuestra que está calificado', d: 'Correo ESPOL, cédula con selfie, matrícula, récord, nota mínima 8/10 por materia y una prueba corta.', run: () => { S.user = null; S.treg = { step: 3, d: { tName: 'Carlos Rivas', tEmail: 'carivas@espol.edu.ec', tPhone: '0987654321', tPass: 'demo123', files: { fCedF: 'cedula_frente.jpg', fCedB: 'cedula_reverso.jpg', fSelf: 'selfie.jpg', fMat: 'matricula_2026.pdf', fRec: 'record.pdf' }, subj: { mat: 9.1, fis: 8.8 } } }; go('registro-tutor'); } },
  { id: 'oferta', tag: 'Oferta', t: 'El tutor se pone en línea y acepta', d: 'Recibe solicitudes solo de sus materias, con 30 s para aceptar. Ve cuánto recibe y su dinero retenido, por liberar y liberado.', run: () => { ensureDemo(); S.user = 'tutor'; const T = S.tutor; T.view = 'panel'; T.online = true; T.active = null; T.pending = { ...(REQS.find(r => T.grades[r.subj] !== undefined) || REQS[1]), left: 30 }; go('tutor'); } },
  { id: 'insignias', tag: 'Atributo 8', t: 'Insignias positivas del estudiante', d: 'Puntual, respetuoso y constante, según la evaluación del tutor. Solo las ven el estudiante, su representante y el tutor asignado.', run: () => { ensureDemo(); S.user = 'student'; resetFlow(); go('estudiante'); tourT(() => $('#badges')?.scrollIntoView({ behavior: 'smooth', block: 'center' }), 250); } },
  { id: 'app', tag: 'Atributo 6', t: 'App liviana y acceso web', d: 'Menos de 50 MB y versión web responsive. Fin de la simulación: puedes explorar libremente desde el simulador.', run: () => { S.user = null; go('inicio'); S.pendingScroll = 'dispositivos'; tourT(() => AFTER.inicio(), 200); } }
];
let tourTs = [];
function tourT(fn, ms) { tourTs.push(setTimeout(fn, ms)); }
function tourGo(i) {
  if (i >= TOUR.length) return ACT.tourExit();
  tourTs.forEach(clearTimeout); tourTs = []; clearTimeout(tourTimer);
  closeModal(); S.tour.on = true; S.tour.i = i; S.simOpen = false; document.body.classList.add('touring');
  TOUR[i].run(); renderTour(); renderSim();
  if (S.tour.auto) scheduleTour();
}
function scheduleTour() { clearTimeout(tourTimer); tourTimer = setTimeout(() => tourGo(S.tour.i + 1), TOUR[S.tour.i].ms || 7000); }
function renderTour() {
  const el = $('#tour');
  if (!S.tour.on) { el.classList.add('hidden'); return; }
  const s = TOUR[S.tour.i], last = S.tour.i === TOUR.length - 1;
  el.classList.remove('hidden');
  el.innerHTML = `<div class="tour-prog"><i style="width:${(S.tour.i + 1) / TOUR.length * 100}%"></i></div><div class="tour-in">
    <span class="tour-n">${S.tour.i + 1} / ${TOUR.length}</span>
    <div class="tour-txt"><span class="tour-tag">${s.tag}</span><b>${s.t}</b><p>${s.d}</p></div>
    <div class="tour-ctrl"><button data-act="tourPrev" ${S.tour.i ? '' : 'disabled'}>◀</button><button data-act="tourAuto">${S.tour.auto ? '❚❚ Pausar' : '▶ Auto'}</button>
    <button class="main" data-act="${last ? 'tourExit' : 'tourNext'}">${last ? 'Terminar' : 'Siguiente ▶'}</button><button data-act="tourExit" aria-label="Salir">✕</button></div></div>`;
}

/* =========================================================
   Eventos y router
   ========================================================= */
document.addEventListener('click', e => {
  if (e.target.id === 'modal') return closeModal();
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  if (el.closest('.sim-panel') && el.dataset.act !== 'simToggle') S.simOpen = false;
  const fn = ACT[el.dataset.act]; if (fn) { e.preventDefault(); fn(el, e); renderSim(); }
});
document.addEventListener('input', e => { if (e.target.id === 'detail') S.flow.detail = e.target.value; if (e.target.id === 'tObs' && S.tutor?.active) S.tutor.active.obs = e.target.value; });
document.addEventListener('submit', e => {
  e.preventDefault();
  const id = e.target.id;
  if (id === 'regForm') return handleRegForm();
  if (id === 'tregForm') return handleTregForm();
  if (id === 'chatForm') { const inp = $('#chatIn'), txt = inp.value.trim(); if (!txt) return; inp.value = ''; pushChat({ from: 'me', text: txt }); autoReply(); return; }
  if (id === 'loginForm') {
    const u = $('#lUser').value.trim().toLowerCase(), pw = $('#lPass').value;
    const cand = [['parent', S.parent && !S.parent.pending && S.parent.email], ['student', S.child && S.child.user], ['tutor', S.tutor && S.tutor.email]].find(([, x]) => x && x.toLowerCase() === u);
    if (!cand) return showErr(['no encontramos esa cuenta (usa las cuentas de esta simulación)']);
    const acc = { parent: S.parent, student: S.child, tutor: S.tutor }[cand[0]];
    if (acc.pass && acc.pass !== pw) return showErr(['contraseña incorrecta']);
    return login(cand[0]);
  }
  if (id === 'dxForm') return handleDxForm();
  if (id === 'inviteForm') {
    const errs = []; if (($('#iPass').value || '').length < 6) errs.push('crea una contraseña de al menos 6 caracteres');
    if (!$('#iData').checked) errs.push('autoriza el tratamiento de datos'); if (!$('#iRec').checked) errs.push('autoriza la grabación');
    if (errs.length) return showErr(errs);
    Object.assign(S.parent, { name: $('#iName').value.trim() || S.parent.name, pass: $('#iPass').value, method: $('input[name=method]:checked').value, pending: false });
    S.child.status = 'activo'; login('parent'); toast(`Aprobaste la cuenta de ${first(S.child.name)}`); return;
  }
  if (id === 'tReportForm') {
    const T = S.tutor, a = T.active;
    if (!tEval.punt || !tEval.resp || !tEval.cons) return showErr(['califica puntualidad, respeto y constancia']);
    const l = T.ledger.find(x => x.id === a.id); if (l) l.status = 'revision';
    T.sessions++; T.active = null; T.view = 'panel'; render();
    toast(`Reporte enviado al representante de ${a.name}`);
    setTimeout(() => { T.reviews.unshift({ by: first(a.name) + ' (estudiante)', stars: pick([5, 5, 4]), text: pick(['Explica muy claro, gracias.', 'Muy paciente, entendí todo.', 'Buena clase, me ayudó para la prueba.']) }); if (route() === 'tutor' && T.view === 'panel') render(); toast('Recibiste una nueva reseña', 'info'); }, 2500);
  }
});
function openModal(html) { $('#modalCard').style.maxWidth = ''; $('#modalCard').innerHTML = html; $('#modal').classList.remove('hidden'); }
function closeModal() { $('#modal').classList.add('hidden'); }
function toast(msg, kind = 'ok') {
  const el = document.createElement('div'); el.className = 'toast ' + kind; el.textContent = msg; $('#toasts').appendChild(el);
  setTimeout(() => el.classList.add('out'), 3200); setTimeout(() => el.remove(), 3600);
}
const ROUTES = ['inicio', 'tutores', 'registro-familia', 'registro-tutor', 'ingresar', 'invitacion', 'padre', 'estudiante', 'diagnostico', 'tutor'];
const PRIVATE = { padre: 'parent', estudiante: 'student', diagnostico: 'student', tutor: 'tutor' };
function route() { const h = location.hash.slice(1); return ROUTES.includes(h) ? h : 'inicio'; }
function go(r) { if (location.hash === '#' + r) render(); else location.hash = r; }
function render() {
  ticks.forEach(id => { clearInterval(id); clearTimeout(id); }); ticks = [];
  let r = route();
  if (PRIVATE[r] && (S.user !== PRIVATE[r] || !{ parent: S.parent, student: S.child, tutor: S.tutor }[PRIVATE[r]])) {
    S.gateMsg = { padre: 'Ingresa con la cuenta del representante para ver este panel.', estudiante: 'Ingresa con la cuenta del estudiante.', diagnostico: 'Ingresa con la cuenta del estudiante para hacer el diagnóstico.', tutor: 'Ingresa con tu cuenta de tutor.' }[r];
    r = 'ingresar';
  } else if (r !== 'ingresar') S.gateMsg = null;
  renderTop(); renderSim();
  $('#app').innerHTML = VIEWS[r]();
  (AFTER[r] || (() => {}))();
}
window.addEventListener('hashchange', () => { if (!S.tour.on) closeModal(); render(); if (!S.pendingScroll) window.scrollTo(0, 0); });
render();
</script>
